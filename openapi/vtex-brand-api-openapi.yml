openapi: 3.2.0
info:
  title: Vtex Brand API
  version: '1.0'
  description: 'Operations tagged Brand across 2 of this provider''s published API definitions: vtex-catalog-api-seller-portal-openapi-original.yml, vtex-catalog-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Brand
paths:
  /api/catalog-seller-portal/brands:
    get:
      tags:
      - Brand
      summary: VTex Get List of Brands
      description: " >\U0001F4D8 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the Beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). \n\n Retrieves general information about all brands of the store. It is mandatory to use at least one query parameter.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| CatalogV2 | Management | **Brand Read** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: ListBrand
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: q
        in: query
        description: Search word.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: tshirt
      - name: from
        in: query
        description: The first page of the interval of the brand list.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: '1'
      - name: to
        in: query
        description: The last page of the interval of the brand list.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: '50'
      - name: orderBy
        in: query
        description: The order that the list is displayed. You can select `name`, or `updated_at` to select the order criteria. Then you can add `,` , `asc` or `desc` to define the brands order.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: status,asc;name,asc
      - name: name
        in: query
        description: Brand name.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Zwilling
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                - id: '863'
                  name: Zwilling
                  isActive: false
                  createdAt: '2021-01-18T14:41:45.696488+00:00'
                  updatedAt: '2021-01-18T14:41:45.696488+00:00'
                - id: '1298'
                  name: Zooz Pets
                  isActive: false
                  createdAt: '2021-01-18T14:45:32.900176+00:00'
                  updatedAt: '2021-01-18T14:45:32.900176+00:00'
                _metadata:
                  total: 1399
                  from: 1
                  to: 10
                  orderBy: name,desc
              schema:
                type: object
                required:
                - data
                - _metadata
                properties:
                  data:
                    type: array
                    description: List with information about the store's brands.
                    items:
                      type: object
                      description: Brand information.
                      required:
                      - id
                      - name
                      - isActive
                      - createdAt
                      - updatedAt
                      properties:
                        id:
                          type: string
                          description: Brand unique identifier number.
                        name:
                          type: string
                          description: Brand name.
                        isActive:
                          type: boolean
                          description: The condition defines if the brand is active (`true`) or inactive (`false`).
                        createdAt:
                          type: string
                          description: Date when the brand was created.
                        updatedAt:
                          type: string
                          description: Last date when the brand was updated.
                  _metadata:
                    type: object
                    description: Information about the organization and exhibition of the brand list.
                    required:
                    - total
                    - from
                    - to
                    - orderBy
                    properties:
                      total:
                        type: integer
                        description: Total of brands on the list.
                      from:
                        type: integer
                        description: The first page of the interval of the brand list.
                      to:
                        type: integer
                        description: The last page of the interval of the brand list.
                      orderBy:
                        type: string
                        description: The order that the list is displayed. You can select `name`, or `updated_at` to select the order criteria. Then you can add `,` , `asc` or `desc` to define the brands order.
    post:
      tags:
      - Brand
      summary: VTex Create Brand
      description: " >\U0001F4D8 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the Beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). \n\n Creates a new brand.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| CatalogV2 | Management | **Brand Write** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: PostBrand
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - isActive
              properties:
                name:
                  type: string
                  description: Brand name.
                  example: Zwilling
                isActive:
                  type: boolean
                  description: The condition defines if the brand is active (`true`) or inactive (`false`).
                  example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: '863'
                name: Zwilling
                isActive: true
                createdAt: '2021-05-17T15:20:36.077253+00:00'
                updatedAt: '2021-01-18T14:41:45.696488+00:00'
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Brand unique identifier number.
                  name:
                    type: string
                    description: Brand name.
                  isActive:
                    type: boolean
                    description: The condition defines if the brand is active (`true`) or inactive (`false`).
                  createdAt:
                    type: string
                    description: Date when the brand was created.
                  updatedAt:
                    type: string
                    description: Last date when the brand was updated.
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/catalog-seller-portal/brands/{brandId}:
    get:
      tags:
      - Brand
      summary: VTex Get Brand by ID
      description: " >\U0001F4D8 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the Beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). \n\n Retrieves general information about a brand by its ID.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| CatalogV2 | Management | **Brand Read** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: GetBrand
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: brandId
        in: path
        description: Brand unique identifier number.
        required: true
        schema:
          type: string
          example: '863'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: '863'
                name: Zwilling
                isActive: false
                createdAt: '2021-01-18T14:41:45.696488+00:00'
                updatedAt: '2021-01-18T14:41:45.696488+00:00'
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Brand unique identifier number.
                  name:
                    type: string
                    description: Brand name.
                  isActive:
                    type: boolean
                    description: The condition defines if the brand is active (`true`) or inactive (`false`).
                  createdAt:
                    type: string
                    description: Date when the brand was created.
                  updatedAt:
                    type: string
                    description: Last date when the brand was updated.
    put:
      tags:
      - Brand
      summary: VTex Update Brand
      description: " >\U0001F4D8 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the Beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). \n\n Updates an existing brand.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| CatalogV2 | Management | **Brand Write** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: PutBrand
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: brandId
        in: path
        description: Brand unique identifier number.
        required: true
        schema:
          type: string
          example: '20'
      requestBody:
        content:
          application/json:
            example:
              id: '20'
              name: Zwilling
              isActive: true
            schema:
              type: object
              required:
              - id
              - name
              - isActive
              properties:
                id:
                  type: string
                  description: Brand unique identifier number.
                  example: '20'
                name:
                  type: string
                  description: Brand name.
                  example: Zwilling
                isActive:
                  type: boolean
                  description: The condition defines if the brand is active (`true`) or inactive (`false`).
                  example: true
      responses:
        '204':
          description: No Content
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/catalog_system/pvt/brand/list:
    get:
      tags:
      - Brand
      summary: VTex Get brand list
      description: "Retrieves all brands registered in the store's Catalog. \n>⚠️ This route's response is limited to 20k results. If you need to obtain more results, please use the [Get paginated brand list](https://developers.vtex.com/vtex-rest-api/reference/catalog-api-get-brand-list) endpoint instead to get a paginated response.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| Catalog | Content | **Brands** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: BrandList
      parameters:
      - $ref: '#/components/parameters/Content-Type_2'
      - $ref: '#/components/parameters/Accept_2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
              - id: 9280
                name: Brand
                isActive: true
                metaTagDescription: Brand
                imageUrl: null
              - id: 2000000
                name: Orma Carbon
                isActive: true
                metaTagDescription: Orma Carbon
                imageUrl: null
              - id: 2000001
                name: Pedigree
                isActive: true
                metaTagDescription: ''
                imageUrl: null
              schema:
                type: array
                description: An array with all brands registered in the store.
                items:
                  $ref: '#/components/schemas/BrandGet'
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/catalog_system/pvt/brand/pagedlist:
    get:
      tags:
      - Brand
      summary: VTex Get paginated brand list
      description: 'Retrieves all brands registered in the store''s Catalog by page number.


        ## Permissions


        Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Brands** |


        There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).


        >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.'
      operationId: BrandListPerPage
      parameters:
      - $ref: '#/components/parameters/Content-Type_2'
      - $ref: '#/components/parameters/Accept_2'
      - name: pageSize
        in: query
        required: true
        description: Quantity of brands per page.
        schema:
          type: integer
          example: 5
      - name: page
        in: query
        required: true
        description: Page number of the brand list.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - paging
                properties:
                  items:
                    type: array
                    description: Array of objects with information of the store's brands.
                    items:
                      $ref: '#/components/schemas/BrandGet'
                  paging:
                    type: object
                    description: Object with pagination information.
                    example:
                      page: 1
                      perPage: 3
                      total: 6
                      pages: 2
                    required:
                    - page
                    - perPage
                    - total
                    - pages
                    properties:
                      page:
                        type: integer
                        description: Page number of the brand list.
                        example: 1
                      perPage:
                        type: integer
                        description: Quantity of brands per page.
                        example: 3
                      total:
                        type: integer
                        description: Total of brands in the store.
                        example: 6
                      pages:
                        type: integer
                        description: Total number of pages.
                        example: 2
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/catalog_system/pvt/brand/{brandId}:
    get:
      tags:
      - Brand
      summary: VTex Get brand by ID
      description: 'Retrieves a specific brand by its ID.


        ## Permissions


        Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Brands** |


        There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).


        >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.'
      operationId: Brand
      parameters:
      - $ref: '#/components/parameters/Content-Type_2'
      - $ref: '#/components/parameters/Accept_2'
      - name: brandId
        in: path
        description: Brand ID.
        required: true
        style: simple
        schema:
          type: string
          example: '123'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandGet'
              example:
                id: 7000000
                name: Pedigree
                isActive: true
                metaTagDescription: Pedigree
                imageUrl: null
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/catalog/pvt/brand:
    post:
      tags:
      - Brand
      summary: VTex Create brand
      description: 'Creates a new brand.


        ## Permissions


        Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Brands Management** |


        There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).


        >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type_2'
