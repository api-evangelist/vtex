      deprecated: false
components:
  parameters:
    invoiceId:
      name: invoiceId
      in: path
      description: Invoice identification.
      required: true
      style: simple
      schema:
        type: string
        example: A424887D0F2D45028FE5C96E9B0E1A2D-01
    creditAccountId:
      name: creditAccountId
      in: path
      description: Credit account identification.
      required: true
      style: simple
      schema:
        type: string
        example: 01bce461-9g03-12ds-8217-b3d39271e15b
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    friendlyId:
      name: friendlyId
      in: query
      description: Simplified identification of an invoice. This code is created automatically, always associated with an existing invoice. It consists of an 8-digit random ID (of numbers and letters) and the installment.
      required: false
      style: form
      schema:
        type: string
        example: u8KFsGDk-1
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
