openapi: 3.2.0
info:
  title: VTex Orders Feed V3 API
  description: 'Each purchase a customer makes in your store generates an [order](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196) on VTEX. With the Orders API, you can view orders statuses and manage multiple aspects involved in order fulfillment, such as financial transactions, invoicing, shipping, and subscriptions. You can also [change orders](https://help.vtex.com/en/tutorial/changing-items-from-a-complete-order--tutorials_190) and make configurations to allow or forbid marketplaces and sellers to change or cancel orders.


    ### Order integration


    To automate actions related to order processing, you can [integrate orders](https://developers.vtex.com/docs/guides/erp-integration-guide) with systems like ERP (Enterprise Resource Planning) and WMS (Warehouse Management System) using [Feed and Hook](https://developers.vtex.com/docs/guides/orders-feed).


    ## Orders API Index


    ### Orders


    - `GET` [Get order](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/pvt/orders/-orderId-)

    - `GET` [List orders](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/pvt/orders)

    - `POST` [Start handling order](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/oms/pvt/orders/-orderId-/start-handling)

    - `POST` [Cancel order](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/oms/pvt/orders/-orderId-/cancel)

    - `POST` [Register change on order](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/oms/pvt/orders/-orderId-/changes)


    ### Invoice


    - `POST` [Order invoice notification](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/oms/pvt/orders/-orderId-/invoice)

    - `PATCH` [Update order''s partial invoice (send tracking number)](https://developers.vtex.com/docs/api-reference/orders-api#patch-/api/oms/pvt/orders/-orderId-/invoice/-invoiceNumber-)


    ### Tracking


    - `PUT` [Update order tracking status](https://developers.vtex.com/docs/api-reference/orders-api#put-/api/oms/pvt/orders/-orderId-/invoice/-invoiceNumber-/tracking)


    ### Conversation


    - `GET` [Retrieve order conversation](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/pvt/orders/-orderId-/conversation-message)


    ### Payment


    - `GET` [Retrieve payment transaction](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/pvt/orders/-orderId-/payment-transaction)

    - `POST` [Send payment notification](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/oms/pvt/orders/-orderId-/payments/-paymentId-/payment-notification)


    ### Feed v2 (deprecated)


    - `GET` [Get feed order status](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/pvt/feed/orders/status)


    ### Feed v3


    - `GET` [Get feed configuration](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/orders/feed/config)

    - `POST` [Create or update feed configuration](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/feed/config)

    - `DELETE` [Delete feed configuration](https://developers.vtex.com/docs/api-reference/orders-api#delete-/api/orders/feed/config)

    - `GET` [Retrieve feed items](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/orders/feed)

    - `POST` [Commit feed items](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/feed)

    - `POST` [Test JSONata expression](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/expressions/jsonata)


    ### Order hook


    - `GET` [Get hook configuration](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/orders/hook/config)

    - `POST` [Create or update hook configuration](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/hook/config)

    - `DELETE` [Delete hook configuration](https://developers.vtex.com/docs/api-reference/orders-api#delete-/api/orders/hook/config)


    ### User orders


    - `GET` [Retrieve user''s orders](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/user/orders)

    - `GET` [Retrieve user order details](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/oms/user/orders/-orderId-)


    ### Change seller


    - `GET` [Get window to change seller](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/checkout/pvt/configuration/window-to-change-seller)

    - `POST` [Update window to change seller](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/checkout/pvt/configuration/window-to-change-seller)'
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey:
  - '{{appKey}}'
  appToken:
  - '{{appToken}}'
tags:
- name: Feed V3
paths:
  /api/orders/feed/config:
    get:
      tags:
      - Feed V3
      summary: VTex Get feed configuration
      description: "The Orders Feed v3 is the best way to create order integrations. Below you can find details on the configuration API specification, and to know more see our [Feed v3 guide](https://developers.vtex.com/vtex-rest-api/docs/orders-feed) and our [order integration guide](https://developers.vtex.com/vtex-rest-api/docs/erp-integration-set-up-order-integration).\n\n> \U0001F4D8 Onboarding guide \n>\n> Check the new [Orders onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/orders-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Orders and is organized by focusing on the developer's journey.\n\n"
      operationId: GetFeedConfiguration
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter:
                    type: object
                    description: Information on how orders are filtered to show on the feed.
                    properties:
                      type:
                        type: string
                        description: Determines what orders appear in the feed and how they are filtered. If a feed has the `FromWorkflow` type configuration, it will receive order updates only when order’s statuses change and orders can be filtered by status, using the `status` field. A feed with the `FromOrders` type configuration gets updates whenever any change is made to an order. in this case, orders can be filtered by any property, according to JSONata expressions set in the `expression` field.
                      status:
                        type: array
                        description: List of order statuses that should be included in the feed. This should only be used in case `type` is `FromWorkflow`.
                        items:
                          type: string
                          description: Order status to be filtered in the feed.
                      expression:
                        type: string
                        description: JSONata query expression that defines what conditions must be met for an order to be included in the feed. This should only be used in case `type` is `FromOrders`.
                      disableSingleFire:
                        type: boolean
                        description: Sets a limit to how many times a specific order shows on the feed, after it first meets filtering conditions. Using the `FromOrders` type configuration with JSONata filtering expressions might cause orders to appear more than once on a feed, whenever changes are made to that order. If this field is `false` orders will appear in the feed only once.
                  queue:
                    type: object
                    description: Information that define the functioning of the queue.
                    properties:
                      visibilityTimeoutInSeconds:
                        type: integer
                        description: Period of time for which an item is not visible in the feed after it has been retrieved with the Get feed items request. Measured in seconds.
                      MessageRetentionPeriodInSeconds:
                        type: integer
                        description: Maximum life span of an order update after it gets to the feed. When a feed item is on the feed for this period of time, it is removed from the feed. Measured in seconds.
                  quantity:
                    type: integer
                    description: Current number of messages in the feed, including messages that may not be visible due to time out after retrieval.
                  approximateAgeOfOldestMessageInSeconds:
                    type: number
                    description: Aproximate age of the oldest message in the feed, measured in seconds.
                example:
                  filter:
                    type: FromOrders
                    expression: status = "payment-pending"
                    disableSingleFire: false
                  queue:
                    visibilityTimeoutInSeconds: 240
                    messageRetentionPeriodInSeconds: 345600
      deprecated: false
    post:
      tags:
      - Feed V3
      summary: VTex Create or update feed configuration
      description: 'The Orders Feed v3 is the best way to create order integrations. Below you can find details on the configuration API specification, and to know more see our [Feed v3 guide](https://developers.vtex.com/vtex-rest-api/docs/orders-feed) and our [order integration guide](https://developers.vtex.com/vtex-rest-api/docs/erp-integration-set-up-order-integration)


        There are two types of filtering that can be used. The `FromWorkflow` type filters orders by status, whereas the `FromOrders` type uses JSONata expressions to filter orders according to any property in the orders JSON document. This enables stores to filter delivered orders and orders in which products have been added or removed, for example. To learn more, access the [JSONata documentation](https://docs.jsonata.org/overview.html) and test filtering JSONata expressions with our [Test JSONata expression](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/expressions/jsonata) endpoint.'
      operationId: FeedConfiguration
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedConfigurationRequest'
            example:
              filter:
                type: FromOrders
                expression: value > 100
                disableSingleFire: false
              queue:
                visibilityTimeoutInSeconds: 250
                MessageRetentionPeriodInSeconds: 345600
        required: true
      responses:
        '200':
          description: Success
        '403':
          description: The credentials are not enabled to access the service
        '404':
          description: Value not found
        '429':
          description: Too many requests
      deprecated: false
    delete:
      tags:
      - Feed V3
      summary: VTex Delete feed configuration
      description: Deletes the configuration set up in [Feed v3](https://developers.vtex.com/docs/guides/orders-feed).
      operationId: FeedConfigurationDelete
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: OK
        '400':
          description: Bad request - Unable to check address / Only https scheme is accepted
        '403':
          description: The credentials are not enabled to access the service
        '404':
          description: Value not found
        '429':
          description: Too many requests
      deprecated: false
  /api/orders/feed:
    get:
      tags:
      - Feed V3
      summary: VTex Retrieve feed items
      description: "Retrieve items from [feed](https://developers.vtex.com/docs/guides/orders-feed) queue. \n\nThe event will be removed if the message `send retry` is equal to, or greater than the maximum retention period.\n\n> This API will return `404 Not Found` if there is no [Feed Configuration](https://developers.vtex.com/docs/guides/orders-feed) available for the given X-VTEX-API-AppKey."
      operationId: Getfeedorderstatus1
      parameters:
      - name: maxlot
        in: query
        description: Lot quantity to retrieve. Maximum accepted value is 10.
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: '{{maxLot}}'
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Getfeedorderstatus'
              example:
              - eventId: ED423DDED4C1AE580CADAC1A4D02DA3F
                handle: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..7RQBZQb6pHhFhA_jMKTiSoJbDck7awgD3Xx7sdJcW6w
                domain: Fulfillment
                state: ready-for-handling
                lastState: window-to-cancel
                orderId: 953712004126-01
                lastChange: '2019-08-12T20:54:01.134057Z'
                currentChange: '2019-08-12T20:54:23.7153839Z'
      deprecated: false
    post:
      tags:
      - Feed V3
      summary: VTex Commit feed items
      description: Commit items in the [feed](https://developers.vtex.com/docs/guides/orders-feed) queue.
      operationId: Commititemfeedorderstatus
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommititemfeedorderstatusRequest'
            example:
              handles:
              - 
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
      deprecated: false
  /api/orders/expressions/jsonata:
    post:
      tags:
      - Feed V3
      summary: VTex Test JSONata expression
      description: 'This endpoint allows you to test a JSON document with a JSONata expression, returning `true` if the document meets the criteria posed in the expression, or `false` if it does not.


        Since JSONata expressions can be used to filter order updates in the [Orders API feed and hook](https://developers.vtex.com/docs/guides/orders-feed), this endpoint can be used to test an expression''s results before configuring the [feed or hook](https://developers.vtex.com/docs/guides/orders-feed).


        Learn more about how to use JSONata expressions, in the [JSONata documentation](https://docs.jsonata.org/overview.html).'
      operationId: TestJSONataExpression
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestJSONataExpression'
            example:
              Expression: status = \"canceled\"
              Document: '{\"status\":\"canceled\"}'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                response:
                  value: 'True'
      deprecated: false
components:
  schemas:
    CommititemfeedorderstatusRequest:
      title: CommititemfeedorderstatusRequest
      required:
      - handles
      type: object
      properties:
        handles:
          type: array
          items:
            type: string
          description: List of item handles to commit.
      example:
        handles:
        - 
    Getfeedorderstatus:
      title: Getfeedorderstatus
      required:
      - eventId
      - handle
      - domain
      - state
      - lastState
      - orderId
      - lastChange
      - currentChange
      type: object
      properties:
        eventId:
          type: string
        handle:
          type: string
        domain:
          type: string
        state:
          type: string
        lastState:
          type: string
        orderId:
          type: string
        lastChange:
          type: string
        currentChange:
          type: string
      example:
        eventId: ED423DDED4C1AE580CADAC1A4D02DA3F
        handle: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..7RQBZQb6pHhFhA_jMKTiSoJbDck7awgD3Xx7sdJcW6w
        domain: Fulfillment
        state: ready-for-handling
        lastState: window-to-cancel
        orderId: 953712004126-01
        lastChange: '2019-08-12T20:54:01.134057Z'
        currentChange: '2019-08-12T20:54:23.7153839Z'
    TestJSONataExpression:
      type: object
      required:
      - Expression
      - Document
      properties:
        Expression:
          type: string
          description: JSONata expression to be tested.
        Document:
          type: string
          description: JSON document to be evaluated by the expression.
    FeedConfigurationRequest:
      title: FeedConfigurationRequest
      required:
      - filter
      - queue
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/FeedFilter'
        queue:
          $ref: '#/components/schemas/Queue'
    Queue:
      title: Queue
      description: Object with information about timeout and message retention.
      required:
      - visibilityTimeoutInSeconds
      - MessageRetentionPeriodInSeconds
      type: object
      properties:
        visibilityTimeoutInSeconds:
          type: integer
          description: Period of time for which an item becomes invisible after it has been [retrieved](https://developers.vtex.com/vtex-rest-api/reference/feed-v3#getfeedorderstatus1). Measured in seconds.
          example: 250
        MessageRetentionPeriodInSeconds:
          type: integer
          description: Maximum life span of an order update in the feed. When a feed item is on the feed for this period of time, it is removed from the feed. Measured in seconds.
          example: 3456000
    FeedFilter:
      title: Filter
      description: Object with type and status that will filter feed orders.
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'Determines what orders appear in the feed and how they are filtered. There are two possible values:


            -`FromWorkflow`: the feed will receive order updates only when order’s statuses change and orders can be filtered by status, using the `status` field described below.


            -`FromOrders`: the feed gets updates whenever any change is made to an order. in this case, orders can be filtered by any property, according to JSONata expressions passed in the `expression` field described below.'
          example: FromWorkflow
        status:
          type: array
          items:
            type: string
          description: "List of order statuses that should be included in the feed. This should only be used in case `type` is set to `FromWorkflow`. The status event will be removed, if it can't deliver a message more than 100 times, 4 days progressively. \n\n**Status available to filter** \n\n- order-created \n\n- on-order-completed \n\n- on-order-completed-ffm \n\n- payment-pending \n\n- waiting-for-order-authorization \n\n- approve-payment \n\n- payment-approved \n\n- request-cancel \n\n- waiting-for-seller-decision \n\n- waiting-ffmt-authorization \n\n- waiting-for-authorization \n\n- waiting-for-manual-authorization \n\n- authorize-fulfillment \n\n- order-create-error \n\n- order-creation-error \n\n- window-to-cancel \n\n- window-to-change-seller \n\n- waiting-for-mkt-authorization \n\n- waiting-seller-handling \n\n- ready-for-handling \n\n- start-handling \n\n- handling \n\n- invoice-after-cancellation-deny \n\n- order-accepted \n\n- invoice \n\n- invoiced \n\n- replaced \n\n- cancellation-requested \n\n- cancel \n\n- canceled."
        expression:
          type: string
          description: JSONata query expression that defines what conditions must be met for an order to be included in the feed. This should only be used in case `type` is set to `FromOrders`.
        disableSingleFire:
          type: boolean
          description: Sets a limit to how many times a specific order shows on the feed, after it first meets filtering conditions. Using the `FromOrders` type configuration with JSONata filtering expressions might cause orders to appear more than once on a feed, whenever changes are made to that order. If this field is `false` orders will appear in the feed only once.
          example: false
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
