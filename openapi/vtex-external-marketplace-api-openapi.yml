                email: email@email.com.br
                firstName: John
                lastName: Doe
                phone: '99999999999'
                document: '99999999999'
                corporateDocument: null
                corporatePhone: null
                corporateName: null
                tradeName: null
                stateInscription: null
              shippingData:
