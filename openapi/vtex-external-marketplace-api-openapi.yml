                - price: 2050
                  selectedDeliveryChannel: delivery
                  selectedSla: Express
                  lockTTL: 1d
                  shippingEstimate: 2d
                  deliveryIds:
                    warehouseId: AR1
                selectedAddresses:
                - addressType: Residential
                  addressId: '1'
                  receiverName: John Doe
                  postalCode: 81020-235
                  city: Curitiba
                  state: PR
                  country: BRA
                  street: Rua Eduardo Carlos Pereira
                  number: '4125'
                  neighborhood: Portão
                  complement: '101'
                  geoCoordinates:
                    latitude: '-29.5'
                    longitude: '-45.8'
                isFob: true
                isMarketplaceFulfillment: true
              invoiceData:
                userPaymentInfo:
                  paymentMethods:
                  - creditCardPaymentGroup
              customData:
                customApps:
                - id: marketplace-integration
                  major: 1
                  fields:
                    marketplacePaymentMethod: credit card
        required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deliverybyseller'
              example:
