openapi: 3.2.0
info:
  title: VTex Master Data API - v2 Clusters API
  description: '>ℹ️ Master Data v2 is not compatible with data entities from previous versions, such as CL and AD.'
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Clusters
paths:
  /api/dataentities/{dataEntityName}/documents/{id}/clusters:
    post:
      tags:
      - Clusters
      summary: VTex Validate document by clusters
      description: 'Checks if a document is present in one or more clusters (specific set of field values).


        >ℹ️ There is a limit of five rules per request.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |

        | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |

        | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: Validatedocumentbyclusters
      parameters:
      - $ref: '#/components/parameters/dataEntityName'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Request body for validating a document by clusters
        content:
          application/json:
            schema:
              type: array
              description: List of cluster validation rule information.
              items:
                type: object
                description: Cluster validation rule information.
                properties:
                  name:
                    type: string
                    description: Cluster name.
                    example: male
                  rule:
                    type: string
                    description: Cluster validation rule.
                    example: gender=male
            example:
            - name: male
              rule: gender=male
            - name: complex
              rule: ((gender=male AND percent=0.35) AND any is null) AND (name=*go*)
            - name: complex2
              rule: ((gender=male AND percent=0.35) AND any is not null) OR (name=*go*)
            - name: createdIn
              rule: createdIn between 2015-10-28 AND 2015-10-30
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array with objects validating each cluster rule.
                items:
                  type: object
                  description: Cluster rule validation object.
                  properties:
                    name:
                      type: string
                      description: Cluster name.
                    isValid:
                      type: boolean
                      description: Informs if the document is valid according to the cluster rule (`true`) or not (`false`).
              example:
              - name: male
                isValid: false
              - name: complex
                isValid: false
              - name: complex2
                isValid: false
              - name: createdIn
                isValid: false
      deprecated: false
components:
  parameters:
    id:
      name: id
      in: path
      description: ID of the Document.
      required: true
      style: simple
      schema:
        type: string
        example: b818cbda-e489-11e6-94f4-0ac138d2d42e
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    dataEntityName:
      name: dataEntityName
      in: path
      required: true
      description: Name of the data entity.
      schema:
        type: string
        example: Newsletter
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
