      - $ref: '#/components/parameters/_sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: List of documents that correspond to the result of the search.
                items:
                  $ref: '#/components/schemas/Using_fields_all'
