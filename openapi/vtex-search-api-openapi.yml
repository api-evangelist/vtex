  /api/dataentities/{dataEntityName}/search:
    get:
      tags:
      - Search
      summary: VTex Search documents
      description: "Retrieves documents' information, while choosing which fields will be returned and filtering documents by specific fields.\n\n> The response header `REST-Content-Range` indicates the total amount of results for that specific search. For example, it may return `resources 0-100/136108`, which indicates it has returned results from 0 to 100 of a total 136108.\n\nBelow you can see some query examples and learn more about each query parameter.\n\n> Avoid sending too many requests with wildcards (`*`) in the search parameters or that use the `keyword` parameter. This may lead to this endpoint being temporarily blocked for your account. If this happens you will receive an error with status code `503`.\n\n## Query examples\n\n### Simple filter\n\n```\n/dataentities/Newsletter/search?email=my@email.com\n```\n\n### Complex filter\n\n```\n/dataentities/Newsletter/search?_where=(firstName=Jon OR lastName=Smith) OR (createdIn between 2001-01-01 AND 2016-01-01)\n```\n\n### Date Range\n\n```\n/dataentities/Newsletter/search?_where=createdIn between 2001-01-01 AND 2016-01-01\n```\n\n### Range numeric fields\n\n```\n/dataentities/Newsletter/search?_where=age between 18 AND 25\n```\n\n### Partial filter\n\n```\n/dataentities/Newsletter/search?firstName=*Maria*\n```\n\n### Filter for null values\n\n```\n/dataentities/Newsletter/search?_where=firstName is null\n```\n\n### Filter for non-null values\n\n```\n/dataentities/Newsletter/search?_where=firstName is not null\n```\n\n### Filter for difference\n```\n/dataentities/Newsletter/search?_where=firstName<>maria\n```\n\n### Filter greater than or less than\n```\n/dataentities/Newsletter/search?_where=number>5\n/dataentities/Newsletter/search?_where=date<2001-01-01\n``` \n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| Dynamic Storage | Dynamic storage generic resources | **Read only documents** |\n| Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |\n| Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |\n| Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: Searchdocuments
      parameters:
      - $ref: '#/components/parameters/dataEntityName'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/REST-Range'
