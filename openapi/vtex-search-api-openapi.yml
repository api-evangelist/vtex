openapi: 3.2.0
info:
  title: Vtex Search API
  version: '1.0'
  contact: {}
  description: 'Operations tagged Search across 2 of this provider''s published API definitions: vtex-legacy-search-openapi-original.yml, vtex-master-data-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
tags:
- name: Search
paths:
  /api/catalog_system/pub/products/search/{search}:
    get:
      tags:
      - Search
      summary: VTex Search for Products
      description: "Retrieves general information about the products related to the term searched. \nThis is the main search used by the store. The user can type anything to be searched.  \n\nFor example, if they search for a \"decanter\", this is the URL: `https://{{accountName}}.{{environment}}.com.br/api/catalog_system/pub/products/search/decanter`. \n\nNote that maybe the response can be HTTP 200 or 206, 206 means that it's a partial content response.\n\nIf it is a 206 take a look at the Headers, will be an entry called resources. E.g.: resources → 0-9/19. This means that the response is showing items from 0 to 9, 10 items, but there were 19 items found. See more information at the paging route example."
      operationId: ProductSearch
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: Content-Type
        in: header
        description: Describes the type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: search
        in: path
        description: Term used to search products
        required: true
        style: simple
        schema:
          type: string
          example: jacket
      responses:
        '200':
          description: OK
          content:
