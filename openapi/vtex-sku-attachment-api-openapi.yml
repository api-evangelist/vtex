openapi: 3.2.0
info:
  title: VTex Catalog SKU Attachment API
  description: '> Check the new Catalog onboarding guide.'
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: SKU Attachment
paths:
  /api/catalog/pvt/skuattachment:
    post:
      tags:
      - SKU Attachment
      summary: VTex Associate SKU attachment
      description: 'Associates an existing SKU to an existing attachment.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **SKUs** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - AttachmentId
              - SkuId
              properties:
                AttachmentId:
                  type: integer
                  description: Attachment ID.
                  example: 1
                SkuId:
                  type: integer
                  description: Unique identifier of an SKU.
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Object containing information about the association between the SKU and the attachment.
                properties:
                  Id:
                    type: integer
                    description: Identifier of the SKU's association to the attachment.
                  AttachmentId:
                    type: integer
                    description: Attachment ID.
                  SkuId:
                    type: integer
                    description: Unique identifier of the SKU.
              example:
                Id: 31
                AttachmentId: 1
                SkuId: 7
      operationId: postApiCatalogPvtSkuattachment
      x-operation-id-source: derived
    delete:
      tags:
      - SKU Attachment
      summary: VTex Dissociate attachments and SKUs
      description: 'Dissociates attachments and SKUs based on an SKU ID or an attachment ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **SKUs** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuId
        in: query
        description: SKU ID. By using this query param, you can dissociate all the attachments from an SKU based on its SKU ID.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          example: 1
      - name: attachmentId
        in: query
        description: Attachment ID. By using this query param, you can dissociate the given attachment from all previously associated SKUs.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          example: 1
      responses:
        '200':
          description: OK
      operationId: deleteApiCatalogPvtSkuattachment
      x-operation-id-source: derived
  /api/catalog/pvt/stockkeepingunit/{skuId}/attachment:
    get:
      tags:
      - SKU Attachment
      summary: VTex Get SKU attachments by SKU ID
      description: 'Retrieves existing SKU attachments by SKU ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **SKUs** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuId
        in: path
        required: true
        description: SKU unique identifier.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of objects with information about the association between the attachments and the SKU.
                items:
                  type: object
                  description: Object containing information about the association between the SKU and the attachment.
                  properties:
                    Id:
                      type: integer
                      description: Identifier of the SKU's association to the attachment.
                    AttachmentId:
                      type: integer
                      description: Attachment ID.
                    SkuId:
                      type: integer
                      description: Unique identifier of the SKU.
              example:
              - Id: 97
                AttachmentId: 1
                SkuId: 1
      operationId: getApiCatalogPvtStockkeepingunitBySkuIdAttachment
      x-operation-id-source: derived
  /api/catalog/pvt/skuattachment/{skuAttachmentAssociationId}:
    delete:
      tags:
      - SKU Attachment
      summary: VTex Delete SKU attachment by attachment association ID
      description: 'Deletes the association of an SKU to an attachment.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **SKUs** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuAttachmentAssociationId
        in: path
        required: true
        description: ID of the association between the attachment and the SKU, which corresponds to the `Id` in the response body of the [Associate SKU attachment](https://developers.vtex.com/vtex-rest-api/reference/catalog-api-post-sku-attachment) and the [Get SKU attachment by SKU ID](https://developers.vtex.com/vtex-rest-api/reference/get_api-catalog-pvt-stockkeepingunit-skuid-attachment) endpoints.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
      operationId: deleteApiCatalogPvtSkuattachmentBySkuAttachmentAssociationId
      x-operation-id-source: derived
  /api/catalog_system/pvt/sku/associateattachments:
    post:
      tags:
      - SKU Attachment
      summary: VTex Associate attachments to an SKU
      description: 'Associates attachments to an SKU based on a given SKU ID and attachment names.

        This request removes existing SKU attachment associations and recreates the associations with the attachments being sent.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **SKUs** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: AssociateattachmentstoSKU
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              required:
              - SkuId
              - AttachmentNames
              type: object
              properties:
                SkuId:
                  type: integer
                  description: Unique identifier of the SKU.
                  example: 1
                AttachmentNames:
                  type: array
                  description: Array with all the names of the attachments that you need to associate to the SKU.
                  items:
                    type: string
                    description: Attachment name.
                    example: T-Shirt Customization
            example:
              SkuId: 1
              AttachmentNames:
              - T-Shirt Customization
        required: true
      responses:
        '200':
          description: OK
      deprecated: false
components:
  parameters:
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
