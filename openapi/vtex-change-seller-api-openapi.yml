openapi: 3.2.0
info:
  title: VTex Orders Change Seller API
  description: Each purchase a customer makes in your store generates an order on VTEX.
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey:
  - '{{appKey}}'
  appToken:
  - '{{appToken}}'
tags:
- name: Change Seller
paths:
  /api/checkout/pvt/configuration/window-to-change-seller:
    get:
      tags:
      - Change Seller
      summary: VTex Get window to change seller
      description: 'Retrieves a marketplace''s window to change seller, that is, the period when it is possible to choose another seller to fulfill a given order after the original seller has canceled it.


        The default period for this window is of 2 days, but it can be configured by the request Update window to change seller.'
      operationId: GetWindowToChangeSeller
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: integer
                description: Window to change seller measured in days.
              examples:
                response:
                  value: 2
      deprecated: false
    post:
      tags:
      - Change Seller
      summary: VTex Update window to change seller
      description: 'Updates a marketplace''s window to change seller, that is, the period when it is possible to choose another seller to fulfill a given order after the original seller has canceled it.


        It is possible to check the current window using the request Get window to change seller.'
      operationId: UpdateWindowToChangeSeller
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - waitingTime
              properties:
                waitingTime:
                  type: integer
                  description: Number of days after order cancelation by a seller, during which another seller may be assigned to fulfill the order.
            example:
              waitingTime: 4
        required: true
      responses:
        '201':
          description: Created
          headers: {}
      deprecated: false
components:
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
