openapi: 3.2.0
info:
  title: Vtex External Seller API
  version: '1.0'
  description: 'Operations tagged External Seller across 2 of this provider''s published API definitions: vtex-marketplace-protocol-external-seller-fulfillment-openapi-original.yml, vtex-marketplace-protocol-external-seller-marketplace-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{fulfillmentEndpoint}
  description: Fulfillment Endpoint.
  variables:
    fulfillmentEndpoint:
      description: This is the fulfillment endpoint registered for each specific external seller in the **seller management** section of VTEX's admin panel.
      default: '{fulfillmentEndpoint}'
- url: https://{marketplaceServicesEndpoint}
  description: Marketplace Service Endpoint
  variables:
    marketplaceServicesEndpoint:
      description: This is an endpoint sent from VTEX to the external seller in the [Order placement request](https://developers.vtex.com/vtex-rest-api/reference/external-seller#order-placement).
      default: '{marketplaceServicesEndpoint}'
tags:
- name: External Seller
paths:
  /pvt/orderForms/simulation:
    post:
      tags:
      - External Seller
      summary: VTex Fulfillment simulation - External Seller
      description: 'This endpoint may be called upon by VTEX for fulfillment simulation in the external seller different contexts. See examples below.


        When a price or inventory notification request returns a response with status `200 OK`, it means that the SKU already exists in the marketplace. Whenever this happens, the marketplace will call the seller to get two updated information about the SKU: Price and Inventory.


        The seller needs to have an endpoint implemented in order to receive this call and send a response containing the requested information to the marketplace. We call it the Fulfillment Simulation endpoint.


        If the seller wishes to include other parameters in this call (like account name, or sales channel ID), this should be done within their {fulfillmentEndpoint}. This path is then inserted in the marketplace''s VTEX admin when configuring a seller.


        The marketplace will send an object containing an array of items. The seller must use this list to get the updated information about the referred SKUs and send them back to the marketplace, following the response format explained in the API Reference.


        This call is also applied in the Storefront simulation scenario, in which case the request from VTEX does not send the parameters `country` and `postalCode`.

        The call''s payload can be adapted into two scenarios:


        - **Displaying items in the storefront**: the address information can be nulled in the request since they are not mandatory data for this context.

        - **Making a shopping cart simulation during checkout**: address information must be sent since this data is needed to calculate freight values. If the address information (including `postalCode` and `country`) is not sent through the call, VTEX interprets the stock balance as zero. Without a valid stock balance, the seller will not be shown as an option during checkout.


        ## Request body example - Indexing simulation


        ```

        {

        "items": [

        {

        "id": "7908010136043",

        "quantity": 1,

        "seller": "1",

        }

        ],

        "isCheckedIn": false,

        }

        ```

        ## Request body example - Checkout simulation


        ```

        {

        "items": [

        {

        "id": "7908010136043",

        "quantity": 1,

        "seller": "1",

        }

        ],

        "postalCode": "22270-030",

        "country": "BRA",

        }

        ```


        ## Permissions


        Check with your service provider to know what permissions are needed.'
      operationId: fulfillment-simulation
      parameters:
      - $ref: '#/components/parameters/fulfillmentEndpoint'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Content-Type'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestFulfillmentSimulation'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFulfillmentSimulation'
              example:
                country: BRA
                items:
                - id: '2000037'
                  listPrice: 67203
                  measurementUnit: un
                  merchantName: mySeller1
                  offerings:
                  - type: Warranty
                    id: '5'
                    name: 1 year warranty
                    price: 10000
                  price: 67203
                  priceTags: []
                  priceValidUntil: '2014-03-01T22:58:28.143'
                  quantity: 1
                  requestIndex: 0
                  seller: '1'
                  unitMultiplier: 1
                logisticsInfo:
                - itemIndex: 0
                  quantity: 1
                  shipsTo:
                  - BRA
                  slas:
                  - id: Curbside pickup
                    deliveryChannel: pickup-in-point
                    name: Curbside pickup
                    shippingEstimate: 0bd
                    price: 0
                    availableDeliveryWindows:
                    - startDateUtc: '2013-02-04T08:00:00+00:00'
                      endDateUtc: '2013-02-04T13:00:00+00:00'
                      price: 0
                    pickupStoreInfo:
                      isPickupStore: true
                      friendlyName: Santa Felicidade
                      address:
                        addressType: pickup
                        receiverName: Juliana
                        addressId: 548304ed-dd40-4416-b12b-4b32bfa7b1e0
                        postalCode: 82320-040
                        city: Curitiba
                        state: PR
                        country: BRA
                        street: Rua Domingos Strapasson
                        number: '100'
                        neighborhood: Santa Felicidade
                        complement: Loja 10
                        reference: Next to the unicorn statue
                        geoCoordinates:
                        - 49.334934
                        - 25.401705
                      additionalInfo: ''
                  stockBalance: 199
                  deliveryChannels:
                  - id: delivery
                    stockBalance: 179
                  - id: pickup-in-point
                    stockBalance: 20
                postalCode: '80250000'
                allowMultipleDeliveries: true
      deprecated: false
      security:
      - appKey: []
        appToken: []
    servers:
    - url: https://{fulfillmentEndpoint}
      description: Fulfillment Endpoint.
      variables:
        fulfillmentEndpoint:
          description: This is the fulfillment endpoint registered for each specific external seller in the **seller management** section of VTEX's admin panel.
          default: '{fulfillmentEndpoint}'
  /pvt/orders:
    post:
      tags:
