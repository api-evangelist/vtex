      operationId: GetComputedPricebypricetable
      parameters:
      - name: categoryIds
        in: query
        description: Category ID.
        required: true
        style: form
        explode: true
        schema:
          type: integer
          example: 1
      - name: brandId
        in: query
        description: Brand ID.
        required: true
        style: form
        explode: true
        schema:
          type: integer
          example: 3
      - name: quantity
        in: query
        description: SKU quantity.
        required: true
        style: form
        explode: true
        schema:
          type: integer
          example: 2
      - name: Content-Type
        in: header
        description: Describes the type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: itemId
        in: path
        description: SKU ID.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      - name: priceTableId
        in: path
        description: SKU Price Table Name.
        required: true
