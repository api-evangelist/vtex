openapi: 3.2.0
info:
  title: VTex Checkout Custom Data API
  description: '>ℹ️ Check the new Checkout onboarding guide.'
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Custom Data
paths:
  /api/checkout/pub/orderForm/{orderFormId}/customData/{appId}:
    put:
      tags:
      - Custom Data
      summary: VTex Set multiple custom field values
      description: 'Your account may create `apps`, which contain custom fields, through the Update orderForm configuration request. The values of these custom fields can then be updated by this request.


        To do that, you need to inform the ID of the app you created with the configuration API (`appId`).


        In the body of the request, for each field created in this app (`appFieldName`) you will inform a value (`appFieldValue`).


        The orderForm is the data structure which represents a shopping cart and contains all information pertaining to it. Hence, the `orderFormId` is the identification code of a given cart.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Checkout | CheckoutResources | **Read Shopping Cart** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: SetMultipleCustomFieldValues
      security: []
      parameters:
      - name: orderFormId
        in: path
        description: ID of the orderForm that will receive the new custom field values.
        required: true
        style: simple
        schema:
          type: string
          example: 29154e27383145cc8ce1f7a1df0d99c4
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: appId
        in: path
        description: ID of the app created with the configuration API.
        required: true
        style: simple
        schema:
          type: string
          example: appId
      requestBody:
        content:
          application/json:
            schema:
              description: Here you must add the pairs of Field Name and Field Value.
              type: object
              additionalProperties: true
              example:
                fieldName: fieldValue
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderForm'
              example:
                orderFormId: ede846222cd44046ba6c638442c3505a
