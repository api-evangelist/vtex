  /api/oms/pvt/orders/{orderId}/start-handling:
    post:
      tags:
      - Orders
      summary: VTex Start handling order
      description: 'Changes the status of an order to indicate that it is in `handling`.


        > Expect a `status 204` response with no content in case of a successful request. The store must validate this response to retry the call if the response differs from the `204` code, making this flow the store''s responsibility. This endpoint can also respond with `status 500`.


        > The `Change order workflow status` resource is needed to use this API request. This is included in `OMS - Full access` and `IntegrationProfile - Fulfillment Oms`, among other default roles available in the Admin. Learn more about the License manager roles and resources.'
      operationId: StartHandling
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: orderId
        in: path
        description: Order ID is a unique code that identifies an order.
        required: true
        style: simple
        schema:
          type: string
          example: 1172452900788-01
        example: 1172452900788-01
      responses:
        '204':
          description: '[No content](https://httpstatuses.com/204)'
        '401':
          description: '[Unauthorized](https://httpstatuses.com/401)'
          content:
            application/json:
              schema:
                type: object
                description: Root object
                properties:
                  error:
                    title: error
                    description: Object containing the error information.
                    type: object
                    properties:
                      code:
                        title: code
                        description: Error code in the Order Management System.
                        type: string
                        example: OMS003
                      message:
                        title: message
                        description: Error message.
                        type: string
                        example: Acesso não autorizado
                      exception:
                        title: exception
                        description: Exception.
                        type:
                        - string
                        - 'null'
                        example: null
              example:
                error:
                  code: '1'
                  message: Acesso não autorizado
                  exception: null
        '403':
          description: '[Forbidden](https://httpstatuses.com/403)'
        '404':
          description: '[Not found](https://httpstatuses.com/404)'
        '409':
          description: '[Conflict](https://httpstatuses.com/409)'
          content:
            application/json:
              schema:
                type: object
                description: Root object
                properties:
                  error:
                    title: error
                    description: Object containing the error information.
                    type: object
                    properties:
                      code:
                        description: Error code in the Order Management System.
                        type: string
                      message:
                        description: Error message.
                        type: string
                      exception:
                        description: Exception.
                        type:
                        - string
                        - 'null'
              example:
                error:
                  code: OMS003
                  message: Order status should be ready-for-handling to perform this action
                  exception: null
        '429':
          description: '[Too many requests](https://httpstatuses.com/429)'
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/oms/pvt/orders/{orderId}/cancel:
    post:
      tags:
      - Orders
      summary: VTex Cancel order
      description: 'Cancels an order using its identification code (`orderId`). A common scenario is when the seller has a problem fulfilling the order and requests the marketplace to cancel it.


        ## Orders that cannot be canceled


        The following situations do not allow order cancellation:


        - **Partial invoices:** Partially invoiced orders cannot be canceled. However, the customer can change the order to replace or remove items from it.


        - **Invoiced status:** Orders with `invoiced` status cannot be canceled. If the order has already been invoiced, you can use the Order invoice notification endpoint to generate a return invoice.


        - **Incomplete orders:** Incomplete orders cannot be canceled.


        ## Declining order cancelation


        The order flow has a cancellation window (grace period) in which the customer can automatically cancel the order. Except for that period, the seller can decline an order cancellation request, regardless of whether the customer or the marketplace initiated it.


        For more information, see Order canceling improvements.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | OMS | OMS access | **Cancel order** |


        You can create a custom role with that resource or use one of the following predefined roles:


        | **Role** | **Resource** |

        | --------------- | ----------------- |

        | OMS - Full access | Cancel order |

        | IntegrationProfile - Fulfillment Oms | Cancel order |


        >❗ Assigning a predefined role to users or application keys usually grants permission to multiple License Manager resources. If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see Best practices for using application keys.


        To learn more about machine authentication at VTEX, see Authentication overview.'
      operationId: CancelOrder
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Describes the type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: orderId
        in: path
        description: ID that identifies the order in the seller.
        example: 1172452900788-01
        required: true
        style: simple
        schema:
          type: string
          example: 1172452900788-01
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancelling the order.
                  example: Unexpected stock shortage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    description: Date and time when the notification was received.
                  orderId:
                    type: string
                    description: Identification of the order in the seller.
                  receipt:
                    type: string
                    description: Protocol code generated by the update. It may be `null`.
              example:
                date: '2014-02-07T15:22:56.7612218-02:00'
                orderId: '123543123'
                receipt: 38e0e47da2934847b489216d208cfd91
        '403':
          description: The credentials are not enabled to access the service.
        '404':
          description: Value not found.
        '429':
          description: Too many requests.
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/oms/pvt/orders/{orderId}/changes:
    post:
      tags:
      - Orders
      summary: VTex Register change on order
      description: 'This request allows changing an order by:


        - Adding items to an order.


        - Removing items from an order.


        - Applying discounts to the total value of the order.


        - Incrementing the total value of the order.


        > **Timeout settings:** This is a synchronous API, which means the application requests data and waits until a value is returned. This behavior can cause timeout errors. To avoid them, we recommend setting the timeout in 20 seconds.


        In change order scenarios, it is possible to insert a Partial invoice. The total value of the order will be updated after the insertion of the invoice, even when there is a partial invoice scenario. The updated value is settled by the VTEX Payment Gateway, and the customer reimbursement is automatic.


        This action can only be done for orders in the following status:


        - `handling`


        - `waiting-for-fulfillment`


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Checkout | CheckoutResources | **Orders Full Access** |

        | OMS | OMS access | **Cancel order** |

        | OMS | OMS access | **Change order** |


        You can create a custom role with that resource or use one of the following predefined roles:


        | **Role** | **Resource** |

        | --------------- | ----------------- |

        | Checkout Admin | Orders Full Access |

        | OMS - Full access |

        Cancel order


        Change order

        |

        | IntegrationProfile - Fulfillment Oms |

        Cancel order


        Change order

        |

        | IntegrationProfile - Fulfillment Gateway | Cancel order |

        | IntegrationProfile - Fulfillment Gateway Oms |

        Cancel order


        Change order

        |

        | inStore Sales Person |

        Cancel order


        Change order

        |


        >❗ Assigning a predefined role to users or application keys usually grants permission to multiple License Manager resources. If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see Best practices for using application keys.


        To learn more about machine authentication at VTEX, see Authentication overview.'
      operationId: RegisterChange
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: orderId
        in: path
        description: ID that identifies the order in the seller.
        example: 1172452900788-01
        required: true
        style: simple
        schema:
          type: string
          example: 1172452900788-01
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterChange'
              example:
                date: '2024-02-08T13:54:33.6868469+00:00'
                orderId: v502538llux-01
                receipt: 535d4581-a2a2-4fd2-a206-1c61eae91b1e
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
