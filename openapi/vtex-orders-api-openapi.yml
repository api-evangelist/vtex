  /api/oms/pvt/orders:
    get:
      tags:
      - Orders
      summary: VTex List orders
      description: 'Retrieves a list of orders according to the filters described below.


        The limit of information retrieval is 30 pages, the default number of orders per page is 15 and it is possible to configure it up to 100 using the `per_page` parameter.


        Be aware that since October 3rd, 2018, this endpoint does not return the `items` property.


        > You can only access information from orders created in the last two years, and that same period is valid for customers through My Account.


        > This endpoint should **not** be used for integrations. Use the orders Feed or hook for this purpose.


        This endpoint returns only orders that already have been indexed, which takes approximately four minutes. Because of this, the data retrieved may present inconsistencies. To get live up-to-date information and build order integrations use the orders Feed or hook.


        > **Onboarding guide**

        >

        > Check the new Orders onboarding guide. We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Orders and is organized by focusing on the developer''s journey.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | OMS | OMS access | **List Orders** |

        | Checkout | CheckoutResources | **Orders Full Access** |


        You can create a custom role with that resource or use one of the following predefined roles:


        | **Role** | **Resource** |

        | --------------- | ----------------- |

        | OMS - Full access | List Orders |

        | Checkout Admin | List Orders |

        | IntegrationProfile - Fulfillment Oms | List Orders |

        | OMS - Full access | Orders Full Access |

        | Checkout Admin | Orders Full Access |

        | IntegrationProfile - Fulfillment Oms | Orders Full Access |


        >❗ Assigning a predefined role to users or application keys usually grants permission to multiple License Manager resources. If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see Best practices for using application keys.


        To learn more about machine authentication at VTEX, see Authentication overview.'
      operationId: ListOrders
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: orderBy
        in: query
        description: "You can retrieve orders lists filtering by an `OrderField` combined with an `OrderType`. To do so, you have to concatenate them: `orderBy={{OrderField}},{{OrderType}}`. \n- `OrderField` values accepted: `creationDate`, `orderId`, `items`, `totalValue` and `origin`. \n- `OrderType` values accepted: `asc` and `desc`."
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: v502556llux-01,asc
      - name: page
        in: query
        description: Define the number of pages you wish to retrieve, restricted to the limit of 30 pages.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 10
      - name: per_page
        in: query
        description: Quantity of orders for each page, the default value is 15 and it goes up to 100 orders per page. Be aware that the limit of retrieval ofthis endpoint is 30 pages.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          example: 15
      - name: f_hasInputInvoice
        in: query
        description: Filters list to return only orders with non `null` values for the `invoiceInput` field.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          example: false
      - name: q
        in: query
        description: "This parameter filters using Fulltext and accepts the values below. Be aware that the `+` caracter is not allowed in Fulltext Search. \n- Order Id \n- Client email \n- Client document \n- Client name"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "- OrderID: v212333lux-02 \n- Client email: taylor@email.com \n- Client document: 21133355524 \n- Client name: Taylor"
      - name: f_shippingEstimate
        in: query
        description: "You can filter orders by shipping estimate time in days by concatenating the desired number of days with the sufix `.days`. For example: \n- Next 7 days: `7.days` \n- Tomorrow: `1.days` \n- Today: `0.days` \n- Late: `-1.days`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: 0.days
      - name: f_invoicedDate
        in: query
        description: "You can filter orders by invoiced date by concatenating the sufix `invoicedDate:` with the range date in Timestamp format. For example: \n- 1 Day: `invoicedDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]`\n- 1 Month: `invoicedDate:[2022-01-01T02:00:00.000Z TO 2022-02-01T01:59:59.999Z]` \n- 1 Year: `invoicedDate:[2022-01-01T02:00:00.000Z TO 2022-01-01T01:59:59.999Z]`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: invoicedDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]
      - name: f_creationDate
        in: query
        description: "You can filter orders by creation date by concatenating the sufix `creationDate:` with the range date in Timestamp format. For example: \n- 1 Day: `creationDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]`\n- 1 Month: `creationDate:[2022-01-01T02:00:00.000Z TO 2022-02-01T01:59:59.999Z]` \n- 1 Year: `creationDate:[2022-01-01T02:00:00.000Z TO 2022-01-01T01:59:59.999Z]`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: creationDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]
      - name: f_authorizedDate
        in: query
        description: "You can filter orders by creation date by concatenating the sufix `authorizedDate:` with the range date in Timestamp format. For example: \n- 1 Day: `authorizedDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]`\n- 1 Month: `authorizedDate:[2022-01-01T02:00:00.000Z TO 2022-02-01T01:59:59.999Z]` \n- 1 Year: `authorizedDate:[2022-01-01T02:00:00.000Z TO 2022-01-01T01:59:59.999Z]`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: creationDate:[2022-01-01T02:00:00.000Z TO 2022-01-02T01:59:59.999Z]
      - name: f_UtmSource
        in: query
        description: You can filter orders by Urchin Tracking Module (UTM) source.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: christmas_campaign
      - name: f_sellerNames
        in: query
        description: You can filter orders by using a seller's name.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: SellerName
      - name: f_callCenterOperatorName
        in: query
        description: You can filter orders by using a Call Center Operator's identification.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Operator%20Name
      - name: f_salesChannel
        in: query
        description: You can filter orders by sales channel's ([or trade policy](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) name.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Main
      - name: salesChannelId
        in: query
        description: You can filter orders by sales channel's ([or trade policy](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) ID.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: '1'
      - name: f_affiliateId
        in: query
        description: You can filter orders by affiliate ID.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: WLM
      - name: f_status
        in: query
        description: "You can filter orders by the following [order status](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196): \n- `waiting-for-sellers-confirmation` \n- `payment-pending` \n- `payment-approved` \n- `ready-for-handling` \n- `handling` \n- `invoiced` \n- `canceled`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: ready-for-handling
      - name: incompleteOrders
        in: query
        description: When set as `true`, you retrieve [incomplete orders](https://help.vtex.com/en/tutorial/understanding-incomplete-orders), when set as `false`, you retrieve orders that are not incomplete.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - name: f_paymentNames
        in: query
        description: You can filter orders by payment type.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Visa
      - name: f_RnB
        in: query
        description: You can filter orders by rates and benefits (promotions).
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Free+Shipping
      - name: searchField
        in: query
        description: "You can search orders by using one of the following criterias: \n- SKU ID - `sku_Ids&sku_Ids` \n- Gift List ID - `listId&listId` \n- Transaction ID (TID) - `tid&tid` \n- PCI Connector's Transaction ID (TID) - `pci_tid&pci_tid` \n- Payment ID (PID) - `paymentId&paymentId` \n- Connector's NSU - `nsu&nsu`"
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "- SKU ID: `25` \n- Gift List ID: `11223` \n- Transaction ID (TID): `54546300238810034995829230012` \n- PCI Connector's Transaction ID (TID): `7032909234899834298423209` \n- Payment ID (PID): `2` \n- Connector's NSU: `2437281`"
      - name: f_isInstore
        in: query
        description: When set as `true`, this parameter filters orders made via [inStore](https://help.vtex.com/en/tracks/what-is-instore--zav76TFEZlAjnyBVL5tRc), and when set as `false`, it filters orders that were not made via inStore.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      responses:
