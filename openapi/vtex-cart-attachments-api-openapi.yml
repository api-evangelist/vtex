  /api/checkout/pub/orderForm/{orderFormId}/attachments/merchantContextData:
    post:
      tags:
      - Cart Attachments
      summary: VTex Add merchant context data
      description: "This endpoint is used for the merchant to add to the cart any relevant information that is related to the context of a specific order.\r\n\r\nThe [orderForm](https://developers.vtex.com/docs/guides/orderform-fields) is the data structure which represents a shopping cart and contains all information pertaining to it. Hence, the `orderFormId` is the identification code of a given cart.\n\r\n\r> This request has a time out of 12 seconds.\r\n\r\n## Permissions\r\n\r\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\r\n\r\n| **Product** | **Category** | **Resource** |\r\n| --------------- | ----------------- | ----------------- |\r\n| Checkout | CheckoutResources | **Read Shopping Cart** |\r\n\r\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\r\n\r\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: AddMerchantContextData
      security: []
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: orderFormId
        in: path
        description: ID of the orderForm that will receive the relevant information added by the merchant.
        required: true
        style: simple
        schema:
          type: string
          example: 29154e27383145cc8ce1f7a1df0d99c4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - salesAssociateData
              properties:
                salesAssociateData:
                  type: object
                  description: Sales Associate information.
                  properties:
                    salesAssociateId:
                      type: string
                      description: Sales Associate (Seller) identification code. All information should be registered by the merchant. Maximum of 100 characters.
                      example: seller123
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  salesAssociateId:
                    type: string
                    description: Sales Associate (Seller) identification code.
              example:
                salesAssociateData:
                  salesAssociateId: seller123
      deprecated: false
