        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Collection | **Read Collections** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: collectionId
        in: path
        required: true
        description: Collection's unique numerical identifier.
        schema:
          type: integer
          example: 151
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
              - Id: 17
                CollectionId: 151
                Name: group 1
                Type: Inclusive
                PreSale: false
                Release: false
              - Id: 18
                CollectionId: 151
                Name: group 2
                Type: Inclusive
                PreSale: false
                Release: false
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: integer
                      description: Subcollection ID.
                    CollectionId:
                      type: integer
                      description: Collection ID.
                    Name:
                      type: string
                      description: SubCollection name.
                    Type:
                      type: string
                      description: Either `“Exclusive”` (all the products contained in it will not be used) or `“Inclusive”` (all the products contained in it will be used).
                    PreSale:
                      type: boolean
                      description: Defines if the collection is on PreSale.
                    Release:
                      type: boolean
                      description: Defines if the collection is a new released one.
      operationId: getApiCatalogPvtCollectionByCollectionIdSubcollection
      x-operation-id-source: derived
