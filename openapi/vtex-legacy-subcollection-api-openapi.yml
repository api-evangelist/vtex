    post:
      tags:
      - Legacy Subcollection
      summary: VTex Add SKU to subcollection
      description: '>⚠️ There are two ways to configure collections, through Legacy CMS Portal or using the Beta Collection module. This endpoint is compatible with collections configured through the Legacy CMS Portal.


        Associates a single SKU to a Subcollection, which is a Group within a Collection.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Configuration | **CMS Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: subCollectionId
        in: path
        required: true
        description: Subcollection'''s unique numerical identifier, which can be obtained by placing a request to [Get subcollection by collection ID](https://developers.vtex.com/vtex-rest-api/reference/catalog-api-get-subcollection-collectionid).
        schema:
          type: integer
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - SkuId
              properties:
                SkuId:
                  type: integer
                  description: Unique identifier of an SKU.
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  SubCollectionId:
                    type: integer
                    description: Subcollection's unique numerical identifier.
                    example: 17
                  SkuId:
                    type: integer
                    description: Unique identifier of the SKU.
                    example: 1
                example:
                  SubCollectionId: 17
                  SkuId: 1
      operationId: postApiCatalogPvtSubcollectionBySubCollectionIdStockkeepingunit
      x-operation-id-source: derived
