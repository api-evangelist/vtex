      summary: VTex Get subcollection by collection ID
      description: '>⚠️ There are two ways to configure collections, through Legacy CMS Portal or using the Beta Collection module. This endpoint is compatible with collections configured through the Legacy CMS Portal.


        Retrieves all subcollections given a collection ID. A subcollection is a Group within a collection.


        ## Permissions


