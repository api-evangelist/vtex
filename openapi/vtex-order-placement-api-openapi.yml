openapi: 3.2.0
info:
  title: VTex Checkout Order Placement API
  description: '>ℹ️ Check the new Checkout onboarding guide.'
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Order Placement
paths:
  /api/checkout/pub/orderForm/{orderFormId}/transaction:
    post:
      tags:
      - Order Placement
      summary: VTex Place order from an existing cart
      description: 'This endpoint places an order from an existing `orderForm` object, meaning an existing cart.


        After the creation of an order with this request, you have five minutes to send payment information and then request payment processing.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Checkout | CheckoutResources | **Read Shopping Cart** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: PlaceOrderFromExistingOrderForm
      security: []
      parameters:
      - name: orderFormId
        in: path
        description: ID of the `orderForm` corresponding to the cart from which to place the order.
        required: true
        style: simple
        schema:
          type: string
          example: ede846222cd44046ba6c638442c3505a
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - referenceId
              - value
              - referenceValue
              - interestValue
              properties:
                referenceId:
                  title: referenceId
                  type: string
                  description: ID of the `orderForm` corresponding to the cart from which to place the order. This is the same as the `orderFormId` parameter.
                  example: 41a22925298a4ddca95318131a25b000
                savePersonalData:
                  title: savePersonalData
                  type: boolean
                  description: '`true` if the shopper''s data provided during checkout should be saved for future reference.'
                  example: false
                optinNewsLetter:
                  title: optinNewsLetter
                  type:
                  - boolean
                  - 'null'
                  description: True if the shopper opted to receive the newsletter.
                  example: false
                value:
                  type: integer
                  description: Total value of the order without separating cents. For example, $24.99 is represented `2499`.
                  example: 6800
                referenceValue:
                  type: integer
                  description: Reference value of the order for calculating interest if that is the case. Can be equal to the total value and does not separate cents. For example, $24.99 is represented `2499`.
                  example: 6800
                interestValue:
                  type: integer
                  description: Interest rate to be used in case it applies.
                  example: 0
      responses:
