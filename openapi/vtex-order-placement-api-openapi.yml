  /api/checkout/pub/gatewayCallback/{orderGroup}:
    post:
      tags:
      - Order Placement
      summary: VTex Process order
      description: 'Order processing callback request, which is made after an order''s payment is approved.


        > This request has to be made within five minutes after the Place order or Place order from existing cart request has been made, or else, the order will not be processed.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Checkout | CheckoutResources | **Save Order Configuration** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: ProcessOrder
      security: []
      parameters:
      - name: orderGroup
        in: path
        description: Order group. It is the part of the `orderId` that comes before the `-`. For example, the `orderGroup` of the order `123456789-01` is `123456789`.
        required: true
        style: simple
        schema:
          type: string
          example: '123456789'
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: Cookie
        in: header
        description: VTEX Chekout cookie associated with a specific order. Use the `Vtex_CHKO_Auth` and the `CheckoutDataAccess` cookies returned by the [Place order](https://developers.vtex.com/vtex-rest-api/reference/order-placement-1#placeorder) or [Place order from existing cart](https://developers.vtex.com/vtex-rest-api/reference/order-placement-1#placeorderfromexistingorderform) API requests, like a browser would.
        required: true
        style: simple
        schema:
          type: string
          example: Vtex_CHKO_Auth=0e/RpYIEZu19BuwXB4tZ7eIGu9HT8vdUAHWQDHDpxMc=; CheckoutDataAccess=0e/PoiTEZu19BuwXB4tZ7eIGu9HT8vdUAHWQDHDpxMc=
      responses:
        '200':
          description: OK
        '428':
          description: This code is used to indicate that a payment redirection flow is required to complete the order, such as using an [external payment application](https://developers.vtex.com/docs/guides/payments-integration-payment-app).
          content:
            application/json:
              schema:
                type: object
                properties:
                  RedirectResponseCollection:
                    type: array
                    description: Redirect Payment information.
                    items:
                      type: object
                      properties:
                        redirectUrl:
                          type: string
                          description: Redirect URL information.
                  paymentAuthorizationAppCollection:
                    type: array
                    description: Payment authorization information.
                    items:
                      type: object
                      properties:
                        appName:
                          type: string
                          description: Indicates which VTEX IO app that will handle the payment flow at Checkout.
                        appPayload:
                          type: object
                          description: App payload information.
                          properties:
                            code:
                              type: string
                              description: URL source of external payment flow.
                            expiresAt:
                              type: string
                              description: Payment flow expiration date in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`).
                            paymentId:
                              type: string
                              description: Payment identifier at VTEX.
                            transactionId:
                              type: string
                              description: Transaction ID.
              example:
                RedirectResponseCollection:
                - redirectUrl: https://bacen.pix/pix/…
                paymentAuthorizationAppCollection:
                - appName: vtex.pix-payment
                  appPayload:
                    code: https://bacen.pix/pix/…
                    expiresAt: '2023-07-12 14:18:11Z'
                    paymentId: 7AA33BDE370746839F2F8C5F13FE1D84
                    transactionId: 7CEA6AD624D54F07825D37EDEAA746ED
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                    description: Operation ID.
                  error:
                    type: object
                    description: Information on the error.
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message.
                      exception:
                        type:
                        - string
                        - 'null'
                        description: Error exception.
              example:
                operationId: a231ed11-255b-4ea0-96c3-1790e1b27f7e
                error:
                  code: '001'
                  message: 'Seu pagamento não foi autorizado. Falha ao enviar os dados de pagamento. Favor entrar em contato com o SAC ou utilizar outra forma de pagamento. *** '
                  exception: null
      deprecated: false
