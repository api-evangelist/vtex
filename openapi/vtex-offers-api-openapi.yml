openapi: 3.2.0
info:
  title: VTex Legacy Search Offers API
  description: "\n> Check the new [Search onboarding guide](https://developers.vtex.com/docs/guides/search-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Search and is organized by focusing on the developer's journey.\n\nThis API lets you search and sort products in the Catalog using Fulltext, Category and Brand search terms. \n\nRetrieve product data to create custom searches and product shelves."
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
tags:
- name: Offers
paths:
  /api/catalog_system/pub/products/offers/{productId}:
    get:
      tags:
      - Offers
      summary: VTex Search Product offers
      description: Retrieves existing offers of a specific product.
      parameters:
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: Content-Type
        in: header
        description: Describes the type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: productId
        in: path
        description: Product unique number identifier.
        required: true
        style: simple
        schema:
          type: string
          example: '3'
      responses:
        '200':
          description: OK
          content:
