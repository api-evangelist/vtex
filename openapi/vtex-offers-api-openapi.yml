                                AvailableQuantity:
                                  type: integer
                                  description: SKU available quantity.
                                  example: 50
                                SaleChannel:
                                  type: integer
                                  description: SKU trade policy.
                                  example: 1
                                Price:
                                  type: number
                                  description: SKU price.
                                  example: 200
                                ListPrice:
                                  type: number
                                  description: SKU list price.
                                  example: 200
                                PriceWithoutDiscount:
                                  type: number
                                  description: SKU precie without discount.
                                  example: 200
                                IsAvailable:
