                                ListPrice: 200
                                PriceWithoutDiscount: 200
                                IsAvailable: false
                              required:
                              - AvailableQuantity
                              - SaleChannel
                              - Price
                              - ListPrice
                              - PriceWithoutDiscount
                              - IsAvailable
