                      description: AKA Commertial Condition.
                      example:
                      - SellerId: '1'
                        SellerSkuId: '5'
                        OffersPerSalesChannel:
                        - AvailableQuantity: 0
                          SaleChannel: 1
                          Price: 200
                          ListPrice: 200
                          PriceWithoutDiscount: 200
                          IsAvailable: false
                        - AvailableQuantity: 0
                          SaleChannel: 2
