    Attachment:
      required:
      - Id
      - Name
      - Keys
      - Fields
      - IsActive
      - IsRequired
      type: object
      description: Object containing information about SKU attachments.
      properties:
        Id:
          type: integer
          format: int32
          description: Attachment ID.
        Name:
          type: string
          description: Attachment Name.
        Keys:
          type: array
          items:
            type: string
          description: Attachment Keys.
        Fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
          description: Array containing Attachment fields.
        IsActive:
          type: boolean
          description: Defines if the Attachment is active or not.
        IsRequired:
          type: boolean
          description: Defines if the Attachment is required or not.
      example:
        Id: 3
        Name: Mensagem
        Keys:
        - nome;20
        - foto;40
        Fields:
        - FieldName: nome
          MaxCaracters: '20'
          DomainValues: Adalberto,Pedro,João
        - FieldName: foto
          MaxCaracters: '40'
          DomainValues: null
        IsActive: true
        IsRequired: false
    SkuSpecification:
      required:
      - FieldId
      - FieldName
      - FieldValueIds
      - FieldValues
      type: object
      description: Object containing related SKU specifications.
      properties:
        FieldId:
          type: integer
          format: int32
          description: Specification field ID.
        FieldName:
          type: string
          description: Specification field Name.
        FieldValueIds:
