        width:
          type: number
          description: SKU width.
      example:
        cubicweight: 81.6833
        height: 65
        length: 58
        weight: 10000
        width: 130
    Image:
      required:
      - ImageUrl
      - ImageName
      - FileId
      type: object
      description: Object containing SKU images details.
      properties:
        ImageUrl:
          type: string
          description: Image URL.
        ImageName:
          type:
          - string
          - 'null'
          description: Image label.
        FileId:
          type: integer
          format: int32
          description: SKU image ID.
      example:
        ImageUrl: http://ambienteqa.vteximg.com.br/arquivos/ids/168952/7508800GG.jpg
        ImageName: ''
        FileId: 168952
    Field:
      required:
      - FieldName
      - MaxCaracters
      - DomainValues
      type: object
      properties:
        FieldName:
          type: string
          description: Attachment field name.
        MaxCaracters:
          type: string
          description: Maximum number of characters accepted in the attachment field.
        DomainValues:
          type:
          - string
          - 'null'
          description: Allowed key values.
      example:
        FieldName: nome
        MaxCaracters: '20'
        DomainValues: Adalberto,Pedro,João
    ProductSpecification:
      required:
      - FieldId
      - FieldName
      - FieldValueIds
      - FieldValues
      type: object
      properties:
        FieldId:
          type: integer
          format: int32
          description: Specification field ID.
        FieldName:
          type: string
          description: Specification name. Limited to 100 characters.
        FieldValueIds:
          type: array
          items:
            type: integer
            format: int32
            description: Specification value ID.
          description: Array with related specification values IDs.
        FieldValues:
          type: array
          items:
            type: string
          description: Array with related specification values.
      example:
        FieldId: 7
        FieldName: Faixa Etária
        FieldValueIds:
        - 58
        - 56
        - 55
        - 52
        FieldValues:
        - 5 a 6 anos
        - 7 a 8 anos
        - 9 a 10 anos
        - Acima de 10 anos
    AlternateIds:
      type: object
      description: Array with alternate SKU IDs, such as EAN and `RefId`.
      properties:
        Ean:
          type: string
          description: SKU EAN.
        RefId:
          type: string
          description: SKU reference ID.
      example:
        Ean: '8781'
        RefId: '878181'
    SkuSeller:
      required:
      - SellerId
      - StockKeepingUnitId
      - SellerStockKeepingUnitId
      - IsActive
      - FreightCommissionPercentage
      - ProductCommissionPercentage
      type: object
      description: Object containing related SKU sellers data.
      properties:
        SellerId:
          type: string
          description: SKU seller ID. This is the ID that identifies the seller in the marketplace. It can be the same as the seller name or a unique number. Check the **Sellers management** section in the Admin to get the correct ID.
        StockKeepingUnitId:
          type: integer
          format: int32
          description: SKU ID.
        SellerStockKeepingUnitId:
          type: string
          description: SKU ID for the SKU seller.
        IsActive:
          type: boolean
          description: Defines if the SKU is active.
        FreightCommissionPercentage:
          type: number
          description: Registered value for Seller Freight Commission.
        ProductCommissionPercentage:
          type: number
          description: Registered value for Seller product Commission.
      example:
        SellerId: '1'
        StockKeepingUnitId: 2001773
        SellerStockKeepingUnitId: '2001773'
        IsActive: true
        FreightCommissionPercentage: 0
        ProductCommissionPercentage: 0
  parameters:
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
