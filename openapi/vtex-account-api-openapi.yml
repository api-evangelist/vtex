components:
  parameters:
    transactionId:
      name: transactionId
      in: path
      description: Pre-authorization identification.
      required: true
      style: simple
      schema:
        type: string
        example: B2E754DCD7304D22866CB6F221CF0FEB
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    creditAccountId:
      name: creditAccountId
      in: path
      description: Credit account identification.
      required: true
      style: simple
      schema:
        type: string
        example: 01bce461-9g03-12ds-8217-b3d39271e15b
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
  schemas:
    LicenseItems:
      description: Object representing licenses.
      type: object
      properties:
        expiration:
          type:
          - string
          - 'null'
          format: date-time
          deprecated: true
          description: Expiration date.
        id:
          description: ID of the category of the license.
          type: number
        isPurchased:
          description: Defines if the license is purchased (`true`) or not (`false`).
          type: boolean
        products:
          description: Array of products.
          type: array
          items:
            description: Object representing products of licenses.
            type: object
            properties:
              id:
                description: ID of the product.
                type: number
              name:
                description: Name of the product.
                type: string
              domains:
                description: List of domains of the product.
                type: array
                items:
                  type: string
                  description: Domain of the product.
                deprecated: true
              endpoints:
                type: object
                description: Endpoints.
                properties:
                  webApiUrl:
                    type:
                    - string
                    - 'null'
                    description: Web API URL.
                    deprecated: true
                  consoleUrl:
                    type:
                    - string
                    - 'null'
                    description: Console URL.
                    deprecated: true
                deprecated: true
        name:
          description: Name of the category of the license.
          type: string
    AccountResponse:
      description: Successful response for `/api/vlm/account`.
      type: object
      properties:
        isActive:
          description: Defines if the account is active (`true`) or not (`false`).
          type: boolean
        id:
          description: ID of the account.
          type: string
        name:
          description: Trading name.
          type: string
        accountName:
          description: Account name.
          type: string
        lv:
          type:
          - string
          - 'null'
          description: Level.
          deprecated: true
        isOperating:
          description: Defines if the account is in production (`true`) or not (`false`).
          type: boolean
        defaultUrl:
          deprecated: true
          description: Default URL.
          type:
          - string
          - 'null'
        district:
          description: Neighborhood of the person assigned as main contact of the store.
          type:
          - string
          - 'null'
        country:
          description: Country of the person assigned as main contact of the store.
          type:
          - string
          - 'null'
        complement:
          description: Additional address of the person assigned as main contact of the store.
          type:
          - string
          - 'null'
        companyName:
          description: Company name.
          type: string
        cnpj:
          description: CNPJ (Corporate Tax ID) of account.
          type:
          - string
          - 'null'
        haveParentAccount:
          description: Defines if the account has a parent account (`true`) or not (`false`).
          type: boolean
        parentAccountId:
          description: ID of the parent account.
          type:
          - string
          - 'null'
        parentAccountName:
          description: Name of the parent account.
          type:
          - string
          - 'null'
        city:
          description: City of the person assigned as main contact of the store.
          type:
          - string
          - 'null'
        address:
          description: Address of the person assigned as main contact of the store.
          type:
          - string
          - 'null'
        logo:
          description: Filename of the account's logotype.
