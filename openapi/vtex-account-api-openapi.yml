                    type: string
                    description: Pre-Authorization identification.
                  value:
                    type: number
                    description: Pre-Authorization value.
                  expirationDate:
                    type: string
                    description: Pre-Authorization expiration date.
                  installments:
                    type: number
                    description: Number of installments.
              example:
                id: 5d96bcdf0fbc46e1866a05f721f31623
                value: 49.7
                expirationDate: '2023-11-25T00:00:00'
                installments: 1
