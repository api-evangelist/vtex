components:
  schemas:
    Data15:
      required:
      - id
      - url
      - name
      - type
      type: object
      properties:
        id:
          type: string
          description: Label ID.
        url:
          type: string
          description: Label URL.
        name:
          type: string
          description: Label name.
        type:
          type: string
          description: Label type.
      example:
        id: JADF8ADF89-7AD7AF-78ADFASDF
        url: http://s3://mybucket-alpha/orc/2013-10-04-custdata/label-pickup.pdf
        name: Delivery label
        type: PDF
    ShippingPrice:
      required:
      - value
      - currency
      type: object
      description: Shipping cost information.
      properties:
        value:
          type: integer
          format: int32
          description: Shipping cost in cents.
        currency:
          type: string
          description: Currency code in [ISO 4217](https://www.iban.com/currency-codes) format.
      example:
        value: 0
        currency: USD
    CancelServiceResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
          example: Service executed successfully
          description: Message of successful cancelation.
        data:
          type: object
          description: Object containing service information.
          required:
          - serviceId
          - carrierId
          - reason
          properties:
            serviceId:
              type: string
              description: Service ID.
              example: apknieot924892jaf-1231
            carrierId:
              type: string
              description: Carrier ID.
              example: servientrega9234jaf
            reason:
              type: string
              example: En el lugar de residencia no hay quien reciba el paquete
              description: Reason for the cancelation.
    Agent:
      required:
      - id
      - name
      - identification
      - phone
      - email
      - vehicle
      type: object
      properties:
        id:
          type: string
          description: Agent ID.
        name:
          type: string
          description: Agent name.
        identification:
          type: string
          description: Agent identification.
        phone:
          type: string
          description: Agent phone number.
        email:
          type: string
          description: Agent email.
        vehicle:
          type: string
          description: Agent vehicle.
      example:
        id: '27327489234'
        name: Pedro
        identification: 020323809
        phone: '+57314855674'
        email: pedro434234@gmailc.om
        vehicle: SCOOTER
    m4031:
      required:
      - message
      - requestId
      type: object
      description: Request information.
      properties:
        message:
          type: string
          description: Request message.
        requestId:
          type: string
          description: Request ID.
      example:
        message: Invalid token
        requestId: 09563f82-fe06-4004-b623-85e3aa4c92c9
    Data3:
      required:
      - status
      - agent
      - trackingUrl
      - totalDistanceTraveled
      - rating
      - shippingPrice
      - shippingEstimatedDate
      type: object
      properties:
        status:
          type: string
          description: Service status.
        agent:
          $ref: '#/components/schemas/Agent'
          description: Service agent.
        trackingUrl:
          type: string
          description: Service tracking URL.
        totalDistanceTraveled:
          type: integer
          format: int32
          description: Delivery total distance traveled in kilometers.
        rating:
          type: integer
          format: int32
          description: Rating.
        shippingPrice:
          type: integer
          format: int32
          description: Shipping price.
        shippingEstimatedDate:
          type: string
          description: Shipping estimated date in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`.
      example:
        status: PENDING
        agent:
          id: '27327489234'
          name: Pedro
          identification: 020323809
          phone: '+57314855674'
          email: pedro434234@gmailc.om
          vehicle: SCOOTER
        trackingUrl: https://localhost.com
        totalDistanceTraveled: 2
        rating: 5
        shippingPrice: 150000
        shippingEstimatedDate: '2024-04-27T20:25:45.067Z'
    Data18:
      required:
      - comment
      - type
      type: object
      properties:
        comment:
          type: string
          description: Service comment.
        type:
          type: string
          description: Service type.
      example:
        comment: The delivery address was changed
        type: END_CLIENT_CANCELED
    CancelOngoingServiceRequest:
      required:
      - comment
      - type
      type: object
      properties:
        comment:
          type: string
          description: Service comment.
        type:
          type: string
          description: Service type.
      example:
        comment: The delivery address was changed
        type: END_CLIENT_CANCELED
    Package:
      required:
      - id
      - orderId
      - envelope
      - dimensions
      - weight
      - totalValue
      - items
      - categories
      - description
      type: object
      description: Package information.
      properties:
        id:
          type: string
          description: Package ID.
        orderId:
          type: string
          description: Order ID.
        envelope:
          type: string
          description: Name of the envelope used.
        dimensions:
          $ref: '#/components/schemas/Dimensions'
          description: Package dimensions.
        weight:
          type: string
          description: Package weight in grams.
        totalValue:
          type: integer
          format: int32
          description: Total value of the order.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
            description: Product general information.
          description: Array containing information about the order's products.
        categories:
          type: array
          items:
            type: string
            description: Category name.
          description: Array of categories.
        description:
          type: string
          description: Package description.
      example:
        id: a46e5bc1-8959-459f-a094-b6e699f7214c
        orderId: 46369545534253-01
        envelope: Foam or Plastic Containers
