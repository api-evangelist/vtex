  /api/logistics/pvt/inventory/items/{itemId}/warehouses/{warehouseId}/dispatched:
    get:
      tags:
      - Inventory
      summary: VTex List inventory with dispatched reservations
      description: "[Reservation](https://help.vtex.com/en/tutorial/how-does-reservation-work--tutorials_92) is the VTEX solution that prevents stores from selling the same item more than once. Adding products to the shopping cart does not create a reservation, this only happens after the shopper completes the purchase.\r\n\r\nThis endpoint lists your [inventory](https://help.vtex.com/en/tutorial/inventory-management--tutorials_139) information about dispatched reservations from a given warehouse. A reservation is considered dispatched after the order has passed the `authorize-fulfillment` status in the [order flow](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196) and is not canceled.\r\n\r\n**Response 400 Bad Request:** When the store has more than 2.000 active reservations, you receive a `400 Bad Request` error with the message: _Too many active reservations_"
      operationId: Getinventorywithdispatchedreservations
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json; charset=utf-8
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: itemId
        in: path
        description: SKU unique identifier called SKU ID. This field is an equivalent to `skuId`.
        required: true
        style: simple
        schema:
          type: string
          description: '89'
      - name: warehouseId
        in: path
        description: Warehouse ID is the unique identifier of the [warehouse](https://help.vtex.com/en/tutorial/warehouse--6oIxvsVDTtGpO7y6zwhGpb).
        required: true
        style: simple
        schema:
          type: string
          description: warehouse-1-StoreName
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    skuId:
                      type: string
                      description: SKU ID.
                    warehouseId:
                      type: string
                      description: Warehouse ID.
                    quantity:
                      type: integer
                      description: SKU quantity.
                    isUnlimitedQuantity:
                      type: boolean
                      description: Indicates whether the SKU's availability is unlimited ("infinite inventory").
                    totalReservedQuantity:
                      type: integer
                      description: Total reserved quantity of the SKU.
                    dispatchedReservationsQuantity:
                      type: integer
                      description: Dispatched reservations quantity.
                    availableQuantity:
                      type: integer
