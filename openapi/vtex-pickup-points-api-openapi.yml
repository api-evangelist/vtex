      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json; charset=utf-8
      - name: Accept
        in: header
        description: HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Pickup point ID.
                    name:
                      type: string
                      description: Pickup point name.
                    description:
                      type: string
                      description: Pickup point description.
                    instructions:
                      type: string
                      description: Instructions.
                    formatted_address:
                      type: string
                      description: Formated address.
                    address:
                      type: object
                      properties:
                        postalCode:
                          type: string
                          description: Postal code.
                        country:
                          type: object
                          properties:
                            acronym:
                              type: string
                              description: Three letter ISO code.
                            name:
                              type: string
                              description: Country name.
                          example:
                            acronym: BRA
                            name: Brazil
                        city:
                          type: string
                          description: City.
                        state:
                          type: string
                          description: State.
                        neighborhood:
                          type: string
                          description: Neighborhood.
                        street:
                          type: string
                          description: Street name.
                        number:
                          type: string
                          description: Pickup point address number.
                        complement:
                          type: string
                          description: Address complement.
                        location:
                          type: object
                          description: Geolocation properties.
                          properties:
                            latitude:
                              type: number
                              description: Latitude.
                            longitude:
                              type: number
                              description: Longitude.
                          example:
                            latitude: -22.974477767944336
                            longitude: -43.18672561645508
                    isActive:
                      type: boolean
                      description: Indicates whether pickup point is active.
                    distance:
                      type: number
                      description: Distance.
                    seller:
                      type: string
                      description: Seller corresponding to pickup point.
                    businessHours:
                      type: array
                      description: Business hours information for each day of the week.
                      items:
                        type: object
                        properties:
                          dayOfWeek:
                            type: integer
                            description: Day of the week, from `0` (sunday) to `6` (saturday).
                          openingTime:
                            type: string
                            description: Opening time in `hh:mm:ss`.
                          closingTime:
                            type: string
                            description: Closing time in `hh:mm:ss`.
                        example:
                          dayOfWeek: 1
                          openingTime: 08:00:00
                          closingTime: '20:00:00'
                    tagsLabel:
                      type: array
                      description: List of tags.
                      items:
                        type: string
                        description: Tag
                    pickupHolidays:
                      type: array
                      description: Holidays which apply for pickup point.
                      items:
                        type: string
                        description: Holliday date.
                    isThirdPartyPickup:
                      type: boolean
                      description: Indicates whether pickup point is third party.
                    accountOwnerName:
                      type: string
                      description: Account owner name.
                    accountOwnerId:
                      type: string
                      description: Account owner ID.
                    accountGroupId:
                      type: string
                      description: Account group ID.
                    parentAccountName:
                      type: string
                      description: Parent account name.
                    originalId:
                      type: string
                      description: Original ID.
                  example:
                    id: '777'
                    name: RetireAqui
                    description: Pup1 description
                    instructions: ''
                    formatted_address: undefined
                    address:
                      postalCode: 21515-001
                      country:
                        acronym: BRA
                        name: Brasil
                      city: Rio de Janeiro
                      state: RJ
                      neighborhood: Barros Filho
                      street: Avenida Brasil
                      number: '21000'
                      complement: ''
                      reference: ''
                      location:
                        latitude: -22.83468
                        longitude: -43.36043
                    isActive: true
                    distance: 1624907186176
                    seller: coinshop
                    _sort:
                    - 1624907190000
                    businessHours:
                    - dayOfWeek: 1
                      openingTime: 00:00:00
                      closingTime: '23:59:00'
                    - dayOfWeek: 2
                      openingTime: 00:00:00
                      closingTime: '23:59:00'
                    - dayOfWeek: 3
                      openingTime: 00:00:00
                      closingTime: '23:59:00'
                    - dayOfWeek: 4
                      openingTime: 00:00:00
                      closingTime: '23:59:00'
                    - dayOfWeek: 5
                      openingTime: 00:00:00
                      closingTime: '23:59:00'
                    tagsLabel: []
                    pickupHolidays: []
                    isThirdPartyPickup: false
                    accountOwnerName: coinshop
                    accountOwnerId: c97ef6c8-491a-439f-927c-f9918644329f
                    accountGroupId: 814a304c-6fe9-4160-b81e-4c7799170993
