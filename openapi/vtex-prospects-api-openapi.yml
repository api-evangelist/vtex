                type: string
                description: Transaction ID.
                example: 418213DE29634837A63DD693A937A696
              merchantName:
                type: string
                description: Merchant name.
                example: luxstore
              payments:
                type: array
                description: List of payments information.
                items:
                  $ref: '#/components/schemas/Payment'
        giftCards:
