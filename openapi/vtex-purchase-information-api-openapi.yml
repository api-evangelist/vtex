components:
  schemas:
    MaskedPurchaseInfoResponse:
      title: Masked purchase information response.
      type: object
      description: Masked purchase information.
      properties:
        id:
          $ref: '#/components/schemas/PurchaseInfoId'
        document:
          $ref: '#/components/schemas/PurchaseInfo'
        meta:
          $ref: '#/components/schemas/PurchaseInfoMeta'
    PurchaseInfoId:
      title: id
      type: string
      description: ID of purchase information.
      example: c2cbebba-214e-40b2-b68f-98f862e755d5
    PurchaseInfoMeta:
      title: Purchase information metadata.
      type: object
      description: Purchase information metadata.
      required:
      - version
      - author
      - creationDate
      - lastUpdateDate
      properties:
        version:
          type: string
          description: Unique identifier of the purchase information version.
          example: 27112371-a71b-45d6-b3bc-93436a3a0b4f
        author:
          type: string
          description: Unique identifier of the user who created the purchase information.
          example: 82a2b53d-39be-4f49-bb7c-8971b58cb7dc
        creationDate:
          type: string
          description: Date when the purchase information was created in ISO 8601 format.
          example: '2022-01-05T15:41:37.5009471+00:00'
        lastUpdateDate:
          type: string
          description: Date when the purchase information was last updated in ISO 8601 format.
          example: '2022-01-05T15:41:37.5009471+00:00'
        expirationDate:
          type: string
          description: Date when the purchase information expires in ISO 8601 format.
          example: '2022-01-05T15:41:37.5009471+00:00'
          nullable: true
    PurchaseInfo:
      title: Purchase information.
      type: object
      description: Purchase information object.
      properties:
        paymentData:
          $ref: '#/components/schemas/PaymentData'
        clientPreferences:
          type: object
          description: Client preferences.
          properties: {}
        isToSavePersonalData:
          type: boolean
          description: Defines if personal data will be saved (`true`) or not (`false`).
        lastUserPurchases:
          type: array
          description: Array with latest purchases from the client.
          items:
            type: object
            description: Purchase information.
            properties:
              creationDate:
                type: string
                description: Purchase date in the ISO 8601 format.
              orderId:
                type: string
                description: Unique identifier of the order.
              orderGroup:
                type: string
                description: Unique identifier of the order group.
              value:
                type: number
                description: Purchase value.
        lastPurchasesAddressId:
          type: string
          description: Unique identifier of the client address.
    PaymentData:
      title: paymentData
      type: object
      description: Payment data.
      properties:
        availableAccounts:
          type: array
          description: List of available payment accounts.
          items:
            type: object
            description: Information about an available payment account.
            properties:
              accountId:
                type: string
                description: Payment account ID.
                example: D09F5E3F01054C959CFC4CB357961ADE
              paymentSystem:
                type: string
                description: Payment system code.
                example: '2'
              paymentSystemName:
                type: string
                description: Payment system name.
                example: Visa
              cardNumber:
                type: string
                description: Masked card number.
                example: '************1111'
              bin:
                type: string
                description: Card bin.
                example: '44443334'
              availableAddresses:
                type: array
                description: List of available addresses.
                items:
                  type: string
                  description: Available address ID.
                  example: db267dcc53c14fb2b9a985532dd287bc
              expirationDate:
                type: string
                description: Card expiration date, in `MM/YYYY` format.
                example: 01/2032
              isExpired:
                type: boolean
                description: Defines if the card is expired (`true`) or not (`false`).
                example: false
              accountStatus:
                type: string
                description: Account status.
                nullable: true
                example: null
        availableTokens:
          type: array
          description: Available tokens.
          items:
            type: string
            description: Available token.
            example: '12345'
        transactions:
          type: array
          description: List of transactions.
          nullable: true
          items:
            type: object
            description: Transaction information.
            required:
            - isActive
            - transactionId
            - merchantName
            - payments
            properties:
              isActive:
                type: boolean
                description: Indicates whether the transaction is active (`true`) or not (`false`).
                example: true
              transactionId:
                type: string
                description: Transaction ID.
                example: 418213DE29634837A63DD693A937A696
              merchantName:
                type: string
                description: Merchant name.
                example: luxstore
              payments:
                type: array
                description: List of payments information.
                items:
                  $ref: '#/components/schemas/Payment'
        giftCards:
          type: array
          description: Gift card IDs.
          items:
            type: string
            description: Gift card ID.
            example: '12345'
        giftCardMessages:
          type: array
          description: Gift card messages.
          items:
            type: string
            description: Gift card message.
            example: Message.
        numberOfPaymentErrors:
          type: number
          description: Amount of payment errors.
          example: 0
        numberOfDeniedTransactions:
          type: number
          description: Amount of denied transactions.
          example: 0
        lastDeniedTransaction:
          type: string
          description: Last denied transaction.
          nullable: true
          example: null
    Payment:
      title: Payment
      required:
      - id
      - paymentSystem
      - paymentSystemName
      - value
      - installments
      - referenceValue
      - cardHolder
      - cardNumber
      - firstDigits
      - lastDigits
      - cvv2
      - expireMonth
      - expireYear
      - url
      - giftCardId
      - giftCardName
      - giftCardCaption
      - redemptionCode
      - group
      - tid
      - dueDate
      - connectorResponses
      type: object
      description: Payment information.
      properties:
        id:
          type: string
          description: Payment ID.
        paymentSystem:
          type: string
          description: Payment system.
        paymentSystemName:
          type: string
          description: Payment system name.
        value:
          type: integer
          format: int32
          description: Payment value in cents.
        installments:
          type: integer
          format: int32
          description: Payment installments.
        referenceValue:
          type: integer
          format: int32
          description: Reference value for interest calculation in cents.
        cardHolder:
          type: string
          nullable: true
          description: Card holder.
        cardNumber:
          type: string
          nullable: true
          description: Card number.
        firstDigits:
          type: string
          nullable: true
          description: Card first digits.
        lastDigits:
          type: string
          nullable: true
          description: Card last digits.
        cvv2:
          type: string
          nullable: true
          description: Card verification code.
        expireMonth:
          type: string
          nullable: true
          description: Card expiration month.
        expireYear:
          type: string
          nullable: true
          description: Card expiration year.
        url:
          type: string
          description: Payment URL.
        giftCardId:
          type: string
          nullable: true
          description: Gift card ID.
        giftCardName:
          type: string
          nullable: true
          description: Gift card name.
        giftCardCaption:
          type: string
          nullable: true
          description: Gift card caption.
        redemptionCode:
          type: string
          nullable: true
          description: Redemption code.
        group:
          type: string
          description: Payment group.
        tid:
          type: string
          nullable: true
          description: Payment TID.
        dueDate:
          type: string
          description: Due date.
        connectorResponses:
          type: object
          description: Connector responses.
      example:
        id: D3DEECAB3C6C4B9EAF8EF4C1FE062FF3
        paymentSystem: '6'
        paymentSystemName: Boleto Bancário
        value: 4450
        installments: 1
        referenceValue: 4450
        cardHolder: null
        cardNumber: null
        firstDigits: null
        lastDigits: null
        cvv2: null
        expireMonth: null
        expireYear: null
        url: https://luxstore.vtexpayments.com.br:443/BankIssuedInvoice/Transaction/418213DE29634837A63DD693A937A696/Payment/D3DEECAB3C6C4B9EAF8EF4C1FE062FF3/Installment/{Installment}
        giftCardId: null
        giftCardName: null
        giftCardCaption: null
        redemptionCode: null
        group: bankInvoice
        tid: null
        dueDate: '2019-02-02'
        connectorResponses: {}
  parameters:
    reason:
      name: reason
      in: query
      description: Reason for requesting unmasked data.
      required: true
      style: form
