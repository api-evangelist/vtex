openapi: 3.2.0
info:
  title: VTex Catalog Category Specification API
  description: '> Check the new Catalog onboarding guide.'
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Category Specification
paths:
  /api/catalog_system/pub/specification/field/listByCategoryId/{categoryId}:
    get:
      tags:
      - Category Specification
      summary: VTex Get specifications by category ID
      description: 'Retrieves all specifications from a category by its ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Groups** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: SpecificationsByCategoryId
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: categoryId
        in: path
        description: Category ID.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySpecification'
              example:
              - Name: Specification A
                CategoryId: 1
                FieldId: 33
                IsActive: true
                IsStockKeepingUnit: false
              - Name: Specification B
                CategoryId: 1
                FieldId: 34
                IsActive: true
                IsStockKeepingUnit: false
              - Name: Specification C
                CategoryId: 1
                FieldId: 35
                IsActive: false
                IsStockKeepingUnit: false
      deprecated: false
  /api/catalog_system/pub/specification/field/listTreeByCategoryId/{categoryId}:
    get:
      tags:
      - Category Specification
      summary: VTex Get specifications tree by category ID
      description: 'Lists all specifications including the current category and the level zero specifications from a category by its ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Groups** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: SpecificationsTreeByCategoryId
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: categoryId
        in: path
        description: Category ID.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySpecification'
              example:
              - Name: Specification A
                CategoryId: 1
                FieldId: 33
                IsActive: true
                IsStockKeepingUnit: false
              - Name: Specification B
                CategoryId: 1
                FieldId: 34
                IsActive: true
                IsStockKeepingUnit: false
              - Name: Specification C
                CategoryId: 1
                FieldId: 35
                IsActive: false
                IsStockKeepingUnit: false
      deprecated: false
components:
  schemas:
    CategorySpecification:
      required:
      - Name
      - CategoryId
      - FieldId
      - IsActive
      - IsStockKeepingUnit
      type: array
      description: Array of objects.
      items:
        type: object
        description: Object containing specification information.
        properties:
          Name:
            type: string
            description: Specification name. Limited to 100 characters.
            example: Composition
          CategoryId:
            type: integer
            description: Category ID.
            example: 1
          FieldId:
            type: integer
            description: Specification field ID.
            example: 1
          IsActive:
            type: boolean
            description: Defines if the specification is active.
            example: true
          IsStockKeepingUnit:
            type: boolean
            description: Defines if it is an SKU specification.
            example: true
      example:
      - Name: Specification A
        CategoryId: 1
        FieldId: 33
        IsActive: true
        IsStockKeepingUnit: false
      - Name: Specification B
        CategoryId: 1
        FieldId: 34
        IsActive: true
        IsStockKeepingUnit: false
      - Name: Specification C
        CategoryId: 1
        FieldId: 35
        IsActive: false
        IsStockKeepingUnit: false
  parameters:
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
