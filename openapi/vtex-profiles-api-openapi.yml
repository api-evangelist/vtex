openapi: 3.2.0
info:
  title: VTex Profile System - PII data architecture Profiles API
  description: '>⚠️ The Profile System is only compatible with stores using the PII data architecture from Data Protection Plus, which is in closed beta phase, only available in select regions.'
  contact: {}
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Profiles
paths:
  /api/storage/profile-system/profiles:
    post:
      tags:
      - Profiles
      summary: VTex Create client profile
      description: 'Creates new client profile.


        You can send custom fields in the request body and they will be saved as part of your document. Therefore, the schema and examples presented below may differ from yours. Your integration must be adapted accordingly.


        The `id` field returned by this request is the `profileId` used to retrieve information on a specific profile later.


        Learn more about the Profile System and its other API endpoints.


        >⚠️ The Profile System is only compatible with stores using the PII data architecture from Data Protection Plus, which is in closed beta phase, only available in select regions.

        >

        > This feature is part of VTEX Shield. If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact Commercial Support. Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our contact form.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Profile System | Documents | **Get Item** |

        | Profile System | Documents | **Save and Update Item** |

        | Profile System | Documents | **Delete Item** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: CreateClientProfile
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/ttl'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/ProfileId'
                  meta:
                    $ref: '#/components/schemas/ProfileMeta'
                  document:
                    $ref: '#/components/schemas/Profile'
              example:
                id: c2cbebba-214e-40b2-b68f-98f862e755d5
                meta:
                  version: 27112371-a71b-45d6-b3bc-93436a3a0b4f
                  author: 82a2b53d-39be-4f49-bb7c-8971b58cb7dc
                  creationDate: '2022-01-05T15:41:37.5009471+00:00'
                  lastUpdateDate: '2022-01-05T15:41:37.5009471+00:00'
                document:
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  birthDate: '1925-11-17'
                  document: '12345678911'
                  documentType: CPF
                  '{customField}': '{value}'
      deprecated: false
  /api/storage/profile-system/profiles/{profileId}:
    get:
      tags:
      - Profiles
      summary: VTex Get profile
      description: 'Retrieves the information of a specific client, by its `profileId`.


        > Since your store''s profile schema is customizable, the schema and examples presented below may differ from yours. Your integration must be adapted accordingly.


        > For security and privacy reasons, this request returns masked profile data. For unmasked information, see Get unmasked profile.


        Learn more about the Profile System and its other API endpoints.


        >⚠️ The Profile System is only compatible with stores using the PII data architecture from Data Protection Plus, which is in closed beta phase, only available in select regions.

        >

        > This feature is part of VTEX Shield. If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact Commercial Support. Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our contact form.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Profile System | Documents | **Get Item** |

        | Profile System | Documents | **Save and Update Item** |

        | Profile System | Documents | **Delete Item** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: GetProfile
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/alternativeKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskedProfileResponse'
              example:
              - id: 70caf394-8534-447e-a0ca-1803c669c771
                meta:
                  version: abc
                  author: e40e0b6d-0605-4fa6-8176-1d69fbaf0818
                  creationDate: 13/12/2021T00:00:00Z
                  lastUpdate: 13/12/2021T00:00:00Z
                document:
                  firstName: J***
                  lastName: D**
                  email: j***.d**@e******.c**
                  birthDate: '1925-11-17'
                  document: 1**********
                  documentType: CPF
                  '{customField}': '{value}'
      deprecated: false
    patch:
      tags:
      - Profiles
      summary: VTex Update client profile
      description: 'Updates one or more fields of an existing client profile.


        > Since your store''s profile schema is customizable, the schema and examples presented below may differ from yours. Your integration must be adapted accordingly.


        Learn more about the Profile System and its other API endpoints.


        >⚠️ The Profile System is only compatible with stores using the PII data architecture from Data Protection Plus, which is in closed beta phase, only available in select regions.

        >

        > This feature is part of VTEX Shield. If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact Commercial Support. Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our contact form.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Profile System | Documents | **Get Item** |

        | Profile System | Documents | **Save and Update Item** |

        | Profile System | Documents | **Delete Item** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: UpdateClientProfile
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/alternativeKey'
      - $ref: '#/components/parameters/ttl'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmaskedProfileResponse'
              example:
                id: 70caf394-8534-447e-a0ca-1803c669c771
                document:
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  birthDate: '1925-11-17'
                  document: '12345678911'
                  documentType: CPF
                meta:
                  version: abc
                  author: e40e0b6d-0605-4fa6-8176-1d69fbaf0818
                  creationDate: '2022-01-05T15:41:37.5009471+00:00'
                  lastUpdate: '2022-01-17T15:41:37.5009471+00:00'
      deprecated: false
    delete:
      tags:
      - Profiles
      summary: VTex Delete client profile
      description: 'Deletes a client profile by `profileId`.


        >❗ This endpoint is not suitable for granting a shopper''s right to erasure. For that purpose, open a support ticket, according to the instructions in the section Request erasure via support of the shopper data erasure guide.


        Learn more about the Profile System and its other API endpoints.


        >⚠️ The Profile System is only compatible with stores using the PII data architecture from Data Protection Plus, which is in closed beta phase, only available in select regions.

        >

        > This feature is part of VTEX Shield. If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact Commercial Support. Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our contact form.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Profile System | Documents | **Get Item** |

        | Profile System | Documents | **Save and Update Item** |

        | Profile System | Documents | **Delete Item** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: DeleteClientProfile
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/profileId'
      responses:
        '204':
          description: No content
      deprecated: false
