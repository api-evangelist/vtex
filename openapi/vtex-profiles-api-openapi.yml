                  version: bb996089-b77c-4bf3-be35-b99b6d91f91c
                  author: e40e0b6d-0605-4fa6-8176-1d69fbaf0818
                  creationDate: '2022-01-05T15:41:37.5009471+00:00'
                  lastUpdate: '2022-01-15T15:41:37.5009471+00:00'
      deprecated: false
  /api/storage/profile-system/profiles/{profileId}/versions/{profileVersionId}/unmask:
    get:
      tags:
      - Profiles
      summary: VTex Get unmasked profile by version
      description: "Retrieves unmasked information of a specific version of a client profile.\n\r\n\r> Since your store's profile schema is customizable, the schema and examples presented below may differ from yours. Your integration must be adapted accordingly.\n\r\n\rLearn more about the [Profile System](https://developers.vtex.com/vtex-rest-api/docs/profile-system) and its other API endpoints.\r\n\r\n>⚠️ The Profile System is only compatible with stores using the PII data architecture from [Data Protection Plus](https://developers.vtex.com/docs/guides/data-protection-plus), which is in closed beta phase, only available in select regions.\r\n>\r\n> This feature is part of [VTEX Shield](https://help.vtex.com/en/tutorial/vtex-shield--2CVk6H9eY2CBtHjtDI7BFh). If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact [Commercial Support](https://help.vtex.com/en/tracks/support-at-vtex--4AXsGdGHqExp9ZkiNq9eMy/3KQWGgkPOwbFTPfBxL7YwZ). Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our [contact form](https://vtex.com/us-en/contact/). \r\n\r\n## Permissions\r\n\r\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\r\n\r\n| **Product** | **Category** | **Resource** |\r\n| --------------- | ----------------- | ----------------- |\r\n| Profile System | Documents | **Get Item** |\r\n| Profile System | Documents | **Save and Update Item** |\r\n| Profile System | Documents | **Delete Item** |\r\n\r\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\r\n\r\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: GetUnmaskedProfileByVersion
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/profileVersionId'
      - $ref: '#/components/parameters/reason'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array with unmasked profile information.
                items:
                  $ref: '#/components/schemas/UnmaskedProfileResponse'
              example:
              - id: 70caf394-8534-447e-a0ca-1803c669c771
                document:
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  birthDate: '1925-11-17'
                  document: '12345678911'
                  documentType: CPF
                  '{customField}': '{value}'
                meta:
                  version: abc
                  author: e40e0b6d-0605-4fa6-8176-1d69fbaf0818
                  creationDate: '2022-01-05T15:41:37.5009471+00:00'
                  lastUpdate: '2022-01-17T15:41:37.5009471+00:00'
      deprecated: false
components:
  schemas:
    MaskedProfileResponse:
      title: Masked profile response
      type: array
      description: Array containing masked profile information.
      items:
        type: object
        description: Masked profile information.
        properties:
          id:
            $ref: '#/components/schemas/ProfileId'
          meta:
            $ref: '#/components/schemas/ProfileMeta'
          document:
            $ref: '#/components/schemas/Profile'
    ProfileId:
      title: id
      type: string
      description: ID of the client's profile.
      example: c2cbebba-214e-40b2-b68f-98f862e755d5
    MaskedProfileResponseByVersion:
      title: Masked profile response
      type: array
      description: Array containing masked profile information.
      items:
        type: object
        description: Masked profile information.
        properties:
          id:
            $ref: '#/components/schemas/ProfileId'
          document:
            $ref: '#/components/schemas/Profile'
          meta:
            $ref: '#/components/schemas/ProfileMeta'
    ProfileMeta:
      title: Profile metadata
      type: object
      description: Profile metadata.
      required:
      - version
      - author
      - creationDate
      - lastUpdate
      properties:
        version:
          type: string
          description: Unique identifier of the profile version.
          example: 27112371-a71b-45d6-b3bc-93436a3a0b4f
        author:
          type: string
          description: Unique identifier of the user who created the profile.
          example: 82a2b53d-39be-4f49-bb7c-8971b58cb7dc
        creationDate:
          type: string
          description: Date when the profile was created in ISO 8601 format.
          example: '2022-01-05T15:41:37.5009471+00:00'
        lastUpdate:
          type: string
          description: Date when the profile was last updated in ISO 8601 format.
          example: '2022-01-05T15:41:37.5009471+00:00'
    UnmaskedProfileResponse:
      title: Unmasked profile response
      type: object
      description: Unmasked profile response.
      properties:
        id:
          $ref: '#/components/schemas/ProfileId'
        document:
          $ref: '#/components/schemas/Profile'
        meta:
          $ref: '#/components/schemas/ProfileMeta'
    Profile:
      title: Profile
      type: object
      description: Profile schema.
      required:
      - firstName
      - lastName
      - email
      - document
      - documentType
      properties:
        firstName:
          type: string
          description: Client's first name.
          example: John
        lastName:
          type: string
          description: Client's last name.
          example: Doe
        email:
          type: string
          description: Client's email address.
          example: john.doe@example.com
        birthDate:
          type: string
          description: Client's birth date in ISO 8601 format.
          example: '1925-11-17'
        document:
          type: string
          description: Client's document.
          example: '12345678900'
        documentType:
          type: string
          description: Type of document informed in `document`.
          example: CPF
        '{customField}':
          type: string
          description: 'Name of custom field defined in [Create or delete custom fields](https://developers.vtex.com/docs/api-reference/profile-system#put-/api/storage/profile-system/schemas/profileSystem/custom). Can be of any type: string, number, boolean, array or object.'
          example: '{value}'
  parameters:
    profileVersionId:
      name: profileVersionId
      in: path
      description: ID of the version of the client's profile as returned by endpoints that create or update profile information in the `version` field.
      required: true
      style: simple
      schema:
        type: string
        example: 70caf394-8534-447e-a0ca-1803c669c771
    ttl:
      name: ttl
      in: query
      description: "This parameter sets the the Time To Live (TTL), in days, of the specific document being created or updated with this request. After this period of time from the moment of the request, the document is deleted. By sending this parameter you override the TTL set for the schema.\n\r\n\r> Currently, the available default document schemas have no TTL. This means that documents are stored indefinitely, unless a TTL is sent when creating or updating."
      required: false
      style: form
      schema:
        type: integer
        example: 365
    reason:
      name: reason
      in: query
      description: Reason for requesting unmasked data.
      required: true
      style: form
      schema:
        type: string
        example: data-validation
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    profileId:
      name: profileId
      in: path
      description: ID of the client's profile as returned by the [Create profile](https://developers.vtex.com/docs/api-reference/profile-system#post-/api/storage/profile-system/profiles) endpoint's response, in the `id` field. It can also be an `alternativeKey` according to your custom profile schema. In this case, this request should also send the `alternativeKey` parameter.
      required: true
      style: simple
      schema:
        type: string
        example: 70caf394-8534-447e-a0ca-1803c669c771
    alternativeKey:
      name: alternativeKey
      in: query
      description: "The `profileId` path parameter may be substituted by other profile fields in this request. When making this request, send the `alternativeKey` parameter with a value equal to the key of the field you wish to use as `profileId`.\n\r\n\r> Currently, there are two possible values for this parameter: `email` and `document`."
      required: false
      style: form
      schema:
        type: string
        example: email
  securitySchemes:
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
