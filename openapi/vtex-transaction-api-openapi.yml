          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/giftcardproviders/{giftCardProviderId}/giftcards/{giftCardId}/transactions/{transactionId}:
    get:
      tags:
      - Transaction
      summary: VTex Get GiftCard Transaction by ID
      description: 'Returns a specific transaction from a gift card.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | GiftCard | GiftCard | **View Gift Card providers** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: GetGiftCardTransactionbyID
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: giftCardProviderId
        in: path
        description: Gift card provider identification.
        required: true
        style: simple
        schema:
          type: string
          example: GiftCardExample
      - name: giftCardId
        in: path
        description: Gift card identification.
        required: true
        style: simple
        schema:
          type: string
          example: 7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70
      - name: transactionId
        in: path
        description: Transaction identification.
        required: true
        style: simple
        schema:
          type: string
          example: jac68316306453f4b8tr3fdb892dfba1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    description: Transaction value.
                  description:
                    type: string
                    description: Transaction description.
                  date:
                    type: string
                    description: Date of the transaction in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`)
                  requestId:
                    type: string
                    description: VTEX request identifier.
                  settlement:
                    type: object
                    description: Settlement transaction information.
                    properties:
                      href:
                        type: string
                        description: Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification.
                  cancellation:
                    type: object
                    description: Cancellation transaction information.
                    properties:
                      href:
                        type: string
                        description: Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification.
                  authorization:
                    type: object
                    description: Authorization transaction information.
                    properties:
                      href:
                        type: string
                        description: Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification.
                  operation:
                    type: string
                    description: Operation information (`Credit` or `Debit`).
              example:
                value: 140
                description: GiftCardHub
                date: '2023-06-02T18:24:49.252855Z'
                requestId: '3'
                settlement:
                  href: cosmetics2/giftcardproviders/GiftCardExample3/giftcards/7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70/transactions/jac68316306453f4b8tr3fdb892dfba1/settlements
                cancellation:
                  href: cosmetics2/giftcardproviders/GiftCardExample3/giftcards/7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70/transactions/jac68316306453f4b8tr3fdb892dfba1/cancellations
                authorization:
                  href: cosmetics2/giftcardproviders/GiftCardExample3/giftcards/7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70/transactions/jac68316306453f4b8tr3fdb892dfba1/authorization
                operation: Credit
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/giftcardproviders/{giftCardProviderId}/giftcards/{giftCardId}/transactions/{tId}/authorization:
    get:
      tags:
      - Transaction
      summary: VTex Get GiftCard Transaction Authorization
      description: 'Returns information about a gift card transaction authorization.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | GiftCard | GiftCard | **View Gift Card providers** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: GetGiftCardAuthorizationTransaction
      parameters:
      - name: Content-Type
        in: header
        description: Type of the content being sent.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: Accept
        in: header
        description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
        required: true
        style: simple
        schema:
          type: string
          default: application/json
      - name: giftCardProviderId
        in: path
        description: Gift card provider identification.
        required: true
        style: simple
        schema:
          type: string
          example: GiftCardExample
      - name: giftCardId
        in: path
        description: Gift card identification.
        required: true
        style: simple
        schema:
          type: string
          example: 7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70
      - name: tId
        in: path
        description: Transaction ID generated by the provider. It is different from the `transactionId` generated by VTEX.
        required: true
        style: simple
        schema:
          type: string
          example: jac68316306453f4b8tr3fdb892dfba1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - oid
                - value
                - date
                type: object
                properties:
                  oid:
                    type: string
                    description: Operation identification.
                  value:
                    type: number
                    description: Value information.
                  date:
                    type: string
                    description: Date of the transaction in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`).
              example:
                oid: faa6831230634c4b8fb897e02ba9c5a1
                value: 140
                date: '2023-06-02T18:24:49.252855Z'
      deprecated: false
    servers:
    - url: https://{accountName}.{environment}.com.br
      description: VTEX server URL.
      variables:
        accountName:
          description: Name of the VTEX account. Used as part of the URL.
          default: apiexamples
        environment:
          description: Environment to use. Used as part of the URL.
          enum:
          - vtexcommercestable
          default: vtexcommercestable
  /api/giftcardproviders/{giftCardProviderId}/giftcards/{giftCardId}/transactions/{tId}/settlements:
    get:
      tags:
      - Transaction
      summary: VTex List All GiftCard Transactions Settlements
      description: 'Returns all transactions settlements for a specific gift card.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

