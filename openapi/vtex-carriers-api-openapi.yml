openapi: 3.2.0
info:
  title: VTex Pick and Pack Last Mile Protocol Carriers API
  description: The Pick and Pack Last Mile Protocol API enables seamless integration between the Pick and Pack app and delivery services.
  version: '1.0'
servers:
- url: https://auth.pickingnpacking.com/{environment}
  variables:
    environment:
      default: DefaultParameterValue
      description: Server to access the authentication necessary to make a request in the Pick and Pack Provider API.
- url: https://{store_endpoint}
  variables:
    your_endpoint:
      default: storeapi.com
      description: Server from the store.
- url: https://api.pickingnpacking.com/{environment}/v1/tracking/hook
  variables:
    environment:
      default: DefaultParameterValue
      description: Environment of the Pick and Pack Protocol App.
tags:
- name: Carriers
paths:
  /rates:
    post:
      tags:
      - Carriers
      summary: VTex Calculate rates
      description: 'Retrieves all rates from the carriers. To understand how to integrate with a carrier, check the VTEX Pick and Pack Carriers Integration Protocol guide.


        This endpoint must be developed by the carriers or brokers to integrate into the protocol.


        ## Permissions


        This endpoint does not require permissions.'
      operationId: Createservice
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            example:
              orderId: SLR-29384924-01
              carrierId: servientrega-50461c9f3335
              seller: qaolimpica
              sender:
                name: Tabitha Sears
                phone: +57 2305781612
                email: tabitha_sears@fortean.brother
                city: Jenkinsville
                state: Northern Mariana Islands
                country: US
                address: 77 Sullivan Place, Jenkinsville, Northern Mariana Islands
                addressComplement: Flat 45
                number: '1029'
                reference: '3'
                location:
                  latitude: -75.269008
                  longitude: 137.499833
                pickupDate: '2024-04-25T18:06:41.202Z'
              receiver:
                name: Pansy Graves
                phone: +57 4240807147
                email: pansy_graves@zentime.moda
                city: Valle
                state: Marshall Islands
                country: Iceland
                neighborhood: Billings
                number: '9840'
                reference: 63 Billings Place, Valle, Marshall Islands
                addressComplement: Flat 32
                location:
                  latitude: -33.249891
                  longitude: -135.052901
                identification: '9541933267'
                deliveryDate: '2024-04-16T20:49:36.117Z'
                contactName: Savannah Porter
                deliveryWindow:
                  name: consectetur
                  initialDate: '2024-04-25T22:50:41.209Z'
                  finalDate: '2024-05-05T21:50:41.210Z'
              packages:
              - id: 6266df719ac55224b793ad36
                orderId: SLR-1221800709659-01
                envelope: Large
                description: Delicate package
                categories:
                - Foods
                dimensions:
                  width: '68'
                  height: '43'
                  length: '13'
                weight: '19'
                totalValue: 5616.01
                items:
                - id: 6266df71a19ebe35637e1f42
                  name: Tomatos
                  ean: '473390795673'
                  refId: '6266'
                  image: https://static9.depositphotos.com/1628352/1107/i/600/depositphotos_11071361-stock-photo-tomato.jpg
                  type: Food
                  price: 774230.01
                  weight: 4 kg
                  quantity: 4
              type: PICKUP_DELIVERY
              carrierServiceType: OTHERS
              comments: Delivery comments.
              paymentMethod: CASH_ON_DELIVERY
              orderValue: 8000
              settings:
              - label: Key secret
                value: keysecret-0122
                key: secrekey
              timezone:
                offset: 300
                value: America/Bogota
            schema:
              $ref: '#/components/schemas/CreateServiceBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceBody'
        '400':
          description: Bad request
        '401':
          description: Required authentication
        '404':
          description: Resource not found
        '500':
          description: Internal error
      deprecated: false
      servers:
      - url: https://{store_endpoint}
        variables:
          your_endpoint:
            default: storeapi.com
            description: Server from the store.
  /list-carriers:
    post:
      tags:
      - Carriers
      summary: VTex List carriers
      description: 'Retrieves all carriers from the broker.


        This endpoint must be developed by the carriers or brokers to integrate into the protocol.


        This endpoint only applies to multi-carrier integrations such as Shipstation or Shippo.


        ## Permissions


        This endpoint does not require permissions.'
      operationId: Createservice
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseService'
        '400':
          description: Bad request
        '401':
          description: Required authentication
        '404':
          description: Resource not found
        '500':
          description: Internal error
      deprecated: false
      servers:
      - url: https://{store_endpoint}
        variables:
          your_endpoint:
            default: storeapi.com
            description: Server from the store.
components:
  schemas:
    InsurancePrice:
      required:
      - value
      - currency
      type: object
      description: Insurance cost information.
      properties:
        value:
          type: integer
          format: int32
          description: Insurance cost in cents.
        currency:
          type: string
          description: Currency code in [ISO 4217](https://www.iban.com/currency-codes) format.
      example:
        value: 0
        currency: USD
    Timezone:
      required:
      - offset
      - value
      - label
      type: object
      description: Time zone information.
      properties:
        offset:
          type: integer
          format: int32
          description: Time zone offset.
        value:
          type: string
          description: Time zone.
        label:
          type:
          - string
          - 'null'
          description: Label.
      example:
        offset: 300
        value: America/Bogota
        label: null
    MetaData1:
      required:
      - integrationResponse
      - carrier
      type: object
      description: Metadata about the Carrier.
      properties:
        integrationResponse:
          type: object
          description: Carrier integration information.
        carrier:
          $ref: '#/components/schemas/Carrier'
      example:
        integrationResponse: {}
        carrier:
          name: '[FedEx] Postmen Testing Account'
          image: null
          metaData: {}
          id: fedex
          type:
            metaData: {}
            terms: ''
            rate:
              shippingPrice:
                value: 284.02
                currency: USD
              insurancePrice:
                value: 0
                currency: USD
            name: FedEx First Overnight®
            transitTime: 0
            shippingEstimatedDate: '2024-01-05T11:11:11.000Z'
            description: FedEx
            id: fedex_first_overnight
            international: false
    Item:
      title: Item
      required:
      - id
      - name
      - ean
      - quantity
      - price
      - refId
      - image
      - type
      - weight
      type: object
      properties:
        id:
          type: string
          description: Product ID.
        name:
          type: string
          description: Product name.
        ean:
          type: string
          description: Unique SKU identification code (barcode). Up to 13 numerical characters.
        quantity:
          type: integer
          format: int32
          description: Quantity of units of the product.
        price:
          type: integer
          format: int32
          description: Product price in cents.
        refId:
          type: string
          description: Product reference ID.
        image:
          type: string
          description: SKU image.
        type:
          type: string
          description: Item type.
        weight:
          type: string
          description: Product weight in grams.
      example:
        id: '184'
        name: Chicken
        ean: EAN354
        quantity: 8
        price: 669
        refId: '314'
        image: https://picsum.photos/seed/YtoZ9/128/480
        type: other
        weight: '6'
    generatedObject:
      required:
      - type
      - note
      - author
      type: object
      properties:
        type:
          type: string
          description: Type of extra information about the item's shipping.
        note:
          type: string
          description: Text with extra information about the item's shipping.
        author:
          type: string
          description: Author.
      example:
        type: COMMENT
        note: The package is delivered at the door
        author: afterShip
    Type:
      title: Type
      required:
      - metaData
      - terms
      - rate
      - name
      - transitTime
      - shippingEstimatedDate
      - description
      - id
      - international
      type: object
      properties:
        metaData:
          type: object
          description: Carrier metadata.
        terms:
          type: string
          description: Carrier terms.
        rate:
          $ref: '#/components/schemas/Rate1'
          description: Carrier rate.
        name:
          type: string
          description: Carrier name.
        transitTime:
          type: integer
          format: int32
          description: Carrier transit time.
        shippingEstimatedDate:
          type:
          - string
          - 'null'
          description: Carrier Shipping estimated date in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`.
        description:
          type: string
          description: Carrier description.
        id:
          type: string
          description: Carrier ID.
        international:
          type: boolean
          description: Defines if the carrier is international (`true`) or not (`false`).
      example:
        metaData: {}
        terms: ''
        rate:
          shippingPrice:
            value: 284.02
            currency: USD
          insurancePrice:
            value: 0
            currency: USD
        name: FedEx First Overnight®
        transitTime: 0
        shippingEstimatedDate: '2024-01-05T11:11:11.000Z'
        description: ''
        id: fedex_first_overnight
        international: false
    Data:
      required:
      - id
      - orderId
      - carrierId
      - serviceId
      - carrierName
      - seller
      - status
      - type
      - tags
      - labels
      - evidences
      - packages
      - timeline
      - notes
      - timezone
      - carrierLogo
      - trackingUrl
      - comments
      - paymentMethod
      - carrierServiceType
      - rate
      - shippingEstimatedDate
      - shippingFinishedDate
      - metaData
      properties:
        id:
          type: string
          description: Service ID.
        orderId:
          type: string
          description: Order ID.
        carrierId:
          type: string
          description: Carrier ID.
        serviceId:
          type: string
          description: Service ID.
        carrierName:
          type: string
          description: Carrier name.
        seller:
          type: string
          description: Identifier representing the seller associated with the order.
        status:
          type: string
          description: Order [status](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196).
        type:
          type: string
          description: Order's type of delivery, `Delivery` or [`Pickup`](https://help.vtex.com/en/tutorial/pickup-points--2fljn6wLjn8M4lJHA6HP3R).
        tags:
          type: array
          items:
            type: string
            description: Extra information added in the order.
          description: Array of tags.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          description: Array containing information about all shipping labels printed in the order.
        evidences:
          type: array
          items:
            type: string
            description: Message explaining the delivery incident.
          description: Array with additional notes when an incident occurs in the delivery of the package.
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          description: Array containing information about all order's packages.
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/Timeline'
          description: Array containing information about the timeline of order changes.
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          description: Array with services information.
        timezone:
          $ref: '#/components/schemas/Timezone'
        carrierLogo:
          type: string
          description: Carrier logo.
        trackingUrl:
          type: string
          description: Tracking URL.
        comments:
          type: string
          description: Comments.
        paymentMethod:
          type: string
          description: Payment method.
        carrierServiceType:
          type: string
          description: Carrier service type. The `carrierServiceType` value is not limited to these specific values. It will be defined by the carrier integrating with the Pick and Pack Last Mile Protocol API.
          enum:
          - BROKER
          - PICKUP_IN_STORE
          - NATIONAL
          - INTERNATIONAL
          - EXPRESS
          - SPECIALIZED
          - OTHERS
        rate:
          $ref: '#/components/schemas/Rate'
        shippingEstimatedDate:
          type: string
          description: Shipping estimated date in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`.
        shippingFinishedDate:
          type:
          - string
          - 'null'
          description: Shipping finished date in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`.
        metaData:
          $ref: '#/components/schemas/MetaData1'
      example:
