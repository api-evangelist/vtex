    LogisticsInfo2:
      title: LogisticsInfo2
      required:
      - itemIndex
      - selectedSla
      - selectedDeliveryChannel
      - addressId
      - slas
      - shipsTo
      - itemId
      - deliveryChannels
      - price
      - listPrice
      - shippingEstimate
      - dockEstimate
