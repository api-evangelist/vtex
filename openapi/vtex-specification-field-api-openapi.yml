- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Specification Field
paths:
  /api/catalog_system/pub/specification/fieldGet/{fieldId}:
    get:
      tags:
      - Specification Field
      summary: VTex Get specification field
      description: "Retrieves details from a specification field by this field's ID. \n>⚠️ This is a legacy endpoint. We recommend using [Get specification](https://developers.vtex.com/vtex-rest-api/reference/get_api-catalog-pvt-specification-specificationid) instead.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| Catalog | Commercial | **SKU management** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: SpecificationsField
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: fieldId
        in: path
        description: Specification field ID.
        required: true
        style: simple
        schema:
          type: integer
          example: 88
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                Name: Material
                CategoryId: 4
                FieldId: 88
                IsActive: true
                IsRequired: true
                FieldTypeId: 1
                FieldTypeName: Texto
                FieldValueId: null
                Description: Composition of the product.
                IsStockKeepingUnit: false
                IsFilter: true
                IsOnProductDetails: false
                Position: 1
                IsWizard: false
                IsTopMenuLinkActive: false
                IsSideMenuLinkActive: true
                DefaultValue: null
                FieldGroupId: 20
                FieldGroupName: Clothes specifications
              schema:
                type: object
                properties:
                  Name:
                    type: string
                    description: Specification field name.
                  FieldId:
                    type: integer
                    description: Specification field ID.
                  IsActive:
                    type: boolean
                    description: Enable (`true`) or disable (`false`) specification.
                  IsRequired:
                    type: boolean
                    description: Makes the specification mandatory (`true`) or optional (`false`).
                  FieldTypeId:
                    type: integer
                    description: Field type ID can be `1 - Text`, `2 - Multi-Line Text`, `4 - Number`, `5 - Combo`, `6 - Radio`, `7 - Checkbox`, `8 - Indexed Text`, `9 - Indexed Multi-Line Text`.
                  FieldTypeName:
                    type: string
                    description: Field type name, which can be `Text`, `Multi-Line Text`, `Number`, `Combo`, `Radio`, `Checkbox`, `Indexed Text` or `Indexed Multi-Line Text`.
                  FieldValueId:
                    type:
                    - integer
                    - 'null'
                    description: Specification value ID.
                  Description:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                  IsStockKeepingUnit:
                    type: boolean
                    description: If `true`, it will be added as a SKU specification. If `false`, it will be added as a product specification field.
                  IsFilter:
                    type: boolean
                    description: 'Store Framework - Deprecated.

                      Legacy CMS Portal - To allow the specification to be used as a facet (filter) on the search navigation bar.'
                  IsOnProductDetails:
                    type: boolean
                    description: 'Store Framework - Deprecated.

                      Legacy CMS Portal -If specification is visible on the product page.'
                  Position:
                    type: integer
                    description: 'Store Framework - Deprecated.

                      Legacy CMS Portal - This position number is used in ordering the specifications both in the navigation menu and in the specification listing on the product page.'
                  IsWizard:
                    type:
                    - boolean
                    - 'null'
                    deprecated: true
                    description: Deprecated field.
                  IsTopMenuLinkActive:
                    type: boolean
                    description: 'Store Framework - Deprecated.

                      Legacy CMS Portal - To make the specification visible in the store''s upper menu.'
                  IsSideMenuLinkActive:
                    type: boolean
                    description: 'Store Framework - Deprecated.

                      Legacy CMS Portal - To make the specification field clickable in the search navigation bar.'
                  DefaultValue:
                    type:
                    - string
                    - 'null'
                    description: Specification default value.
                  FieldGroupId:
                    type: integer
                    description: ID of the group of specifications that contains the new specification.
                  FieldGroupName:
                    type: string
                    description: Specification field group name.
      deprecated: false
  /api/catalog_system/pvt/specification/field:
    post:
      tags:
      - Specification Field
      summary: VTex Create specification field
      description: "Creates a specification field in a category. \n>⚠️ This is a legacy endpoint. We recommend using [Create specification](https://developers.vtex.com/docs/api-reference/catalog-api#post-/api/catalog/pvt/specification?endpoint=post-/api/catalog/pvt/specification) instead.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| Catalog | Commercial | **SKU management** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: SpecificationsInsertField
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationsInsertFieldRequest'
            example:
              Name: Material
              CategoryId: 4
              FieldId: 88
              IsActive: true
              IsRequired: true
              FieldTypeId: 1
              FieldValueId: 1
              IsStockKeepingUnit: false
              Description: Composition of the product.
              IsFilter: true
              IsOnProductDetails: false
              Position: 1
              IsWizard: false
              IsTopMenuLinkActive: true
              IsSideMenuLinkActive: true
              DefaultValue: null
              FieldGroupId: 20
              FieldGroupName: Clothes specifications
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: 89
              schema:
                type: integer
                description: Specification field ID.
      deprecated: false
    put:
      tags:
      - Specification Field
      summary: VTex Update specification field
      description: "Updates a specification field in a category. \n>⚠️ This is a legacy endpoint. We recommend using [Update specification](https://developers.vtex.com/docs/api-reference/catalog-api#put-/api/catalog/pvt/stockkeepingunit/-skuId-/specification?endpoint=put-/api/catalog/pvt/stockkeepingunit/-skuId-/specification) instead.\n\n## Permissions\n\nAny user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:\n\n| **Product** | **Category** | **Resource** |\n| --------------- | ----------------- | ----------------- |\n| Catalog | Commercial | **SKU management** |\n\nThere are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).\n\n>❗ To prevent integrations from having excessive permissions, consider the [best practices for managing app keys](https://help.vtex.com/en/tutorial/best-practices-application-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations."
      operationId: SpecificationsInsertFieldUpdate
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationsInsertFieldUpdateRequest'
            example:
              FieldId: 89
              Name: Material
              CategoryId: 4
              IsActive: true
              IsRequired: true
              FieldTypeId: 1
              Description: Composition of the product.
              IsStockKeepingUnit: false
              IsFilter: true
              IsOnProductDetails: true
              Position: 1
              IsWizard: false
              IsTopMenuLinkActive: false
              IsSideMenuLinkActive: false
              DefaultValue: Cotton
              FieldGroupId: 20
              FieldGroupName: Clothes specifications
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: 89
              schema:
                type: integer
                description: Specification field ID.
      deprecated: false
