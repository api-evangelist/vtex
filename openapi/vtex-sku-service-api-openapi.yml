openapi: 3.2.0
info:
  title: VTex Catalog SKU Service API
  description: '> Check the new Catalog onboarding guide.'
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: SKU Service
paths:
  /api/catalog/pvt/skuservice/{skuServiceId}:
    get:
      tags:
      - SKU Service
      summary: VTex Get SKU service
      description: 'Retrieves an SKU service.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Commercial | **SKU Services** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuServiceId
        in: path
        required: true
        description: SKU service unique identifier.
        schema:
          type: integer
          example: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUService'
              example:
                Id: 1
                SkuServiceTypeId: 1
                SkuServiceValueId: 1
                SkuId: 1
                Name: name
                Text: text
                IsActive: false
      operationId: getApiCatalogPvtSkuserviceBySkuServiceId
      x-operation-id-source: derived
    put:
      tags:
      - SKU Service
      summary: VTex Update SKU service
      description: 'Updates an SKU service.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Commercial | **SKU Services** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuServiceId
        in: path
        required: true
        description: SKU service unique identifier.
        schema:
          type: integer
          example: 5
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - SkuServiceTypeId
              - SkuServiceValueId
              - SkuId
              - Name
              - Text
              - IsActive
              properties:
                SkuServiceTypeId:
                  type: integer
                  description: SKU service type ID.
                  example: 2
                SkuServiceValueId:
                  type: integer
                  description: SKU service value ID.
                  example: 1
                SkuId:
                  type: integer
                  description: SKU ID.
                  example: 1
                Name:
                  type: string
                  description: SKU service name. Maximum of 50 characters.
                  example: Test name
                Text:
                  type: string
                  description: Internal description for the SKU service. Maximum of 100 characters.
                  example: Text
                IsActive:
                  type: boolean
                  description: Defines if the SKU service is active or not.
                  example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUService'
              example:
                Id: 1
                SkuServiceTypeId: 1
                SkuServiceValueId: 1
                SkuId: 1
                Name: name
                Text: text
                IsActive: false
      operationId: putApiCatalogPvtSkuserviceBySkuServiceId
      x-operation-id-source: derived
    delete:
      tags:
      - SKU Service
      summary: VTex Dissociate SKU service
      description: 'Dissociates an SKU service from an SKU.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Commercial | **SKU Services** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: skuServiceId
        in: path
        required: true
        description: SKU service unique identifier.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
      operationId: deleteApiCatalogPvtSkuserviceBySkuServiceId
      x-operation-id-source: derived
  /api/catalog/pvt/skuservice:
    post:
      tags:
      - SKU Service
      summary: VTex Associate SKU service
      description: 'Associates an SKU service to an SKU.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Commercial | **SKU Services** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - SkuServiceTypeId
              - SkuServiceValueId
              - SkuId
              - Name
              - Text
              - IsActive
              properties:
                SkuServiceTypeId:
                  type: integer
                  description: SKU service type ID.
                  example: 1
                SkuServiceValueId:
                  type: integer
                  description: SKU service value ID.
                  example: 1
                SkuId:
                  type: integer
                  description: SKU ID.
                  example: 1
                Name:
                  type: string
                  description: SKU service name. Maximum of 50 characters.
                  example: Engraving
                Text:
                  type: string
                  description: Internal description of the SKU service. Maximum of 100 characters.
                  example: Name engraving additional service.
                IsActive:
                  type: boolean
                  description: Defines if the SKU service is active or not.
                  example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUService'
              example:
                Id: 1
                SkuServiceTypeId: 1
                SkuServiceValueId: 1
                SkuId: 1
                Name: name
                Text: text
                IsActive: false
      operationId: postApiCatalogPvtSkuservice
      x-operation-id-source: derived
components:
  parameters:
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  schemas:
    SKUService:
      type: object
      properties:
        Id:
          type: integer
          description: SKU service ID.
          example: 1
        SkuServiceTypeId:
          type: integer
          description: SKU service type ID.
          example: 1
        SkuServiceValueId:
          type: integer
          description: SKU service value ID.
          example: 1
        SkuId:
          type: integer
          description: SKU ID.
          example: 1
        Name:
          type: string
          description: SKU service name. Maximum of 50 characters.
          example: Engraving
        Text:
          type: string
          description: Internal description of the SKU service. Maximum of 100 characters.
          example: Name engraving additional service.
        IsActive:
          type: boolean
          description: Defines if the SKU service is active or not.
          example: true
      example:
        Id: 1
        SkuServiceTypeId: 1
        SkuServiceValueId: 1
        SkuId: 1
        Name: name
        Text: text
        IsActive: false
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
