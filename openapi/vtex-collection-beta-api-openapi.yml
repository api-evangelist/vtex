      operationId: GET-Productsfromacollection
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: collectionId
        in: path
        description: Collection's unique identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      - name: page
        in: query
        description: Page number.
        required: false
        style: form
        schema:
          type: integer
          example: 2
      - name: pageSize
        in: query
        description: Number of the items of the page.
        required: false
        style: form
        schema:
          type: integer
          example: 15
      - name: Filter
        in: query
        description: Filter used to refine the collection's products.
        required: false
        style: form
        schema:
          type: string
          example: Pre launch
      - name: Active
        in: query
        description: Defines if the status of the product is active or not.
        required: false
        style: form
        schema:
          type: boolean
          example: true
      - name: Visible
        in: query
        description: Defines if the product is visible on the store or not.
        required: false
        style: form
        schema:
          type: boolean
          example: true
      - name: CategoryId
        in: query
        description: Product's category unique identifier.
        required: false
        style: form
        schema:
          type: integer
          example: 12
      - name: BrandId
        in: query
        description: Product's brand unique identifier.
        required: false
        style: form
        schema:
          type: integer
          example: 3
      - name: SupplierId
        in: query
        description: Product's supplier unique identifier.
        required: false
        style: form
        schema:
          type: integer
          example: 1
      - name: SalesChannelId
        in: query
        description: Product's trade policy unique identifier.
        required: false
        style: form
        schema:
          type: integer
          example: 1
      - name: ReleaseFrom
        in: query
        description: Product past release date.
        required: false
        style: form
        schema:
          type: string
          example: '2069-11-26T15:23:00'
      - name: ReleaseTo
        in: query
        description: Product future release date.
        required: false
        style: form
        schema:
          type: string
          example: '2069-11-26T15:23:00'
      - name: SpecificationProduct
        in: query
        description: Product specification field Value. You must also fill in `SpecificationFieldId` to use this parameter.
        required: false
        style: form
        schema:
          type: string
          example: M
      - name: SpecificationFieldId
        in: query
        description: Product specification field unique identifier.
        required: false
        style: form
        schema:
          type: integer
          example: 40
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Page:
                    description: Page number.
                    type: integer
                  Size:
                    description: Page list size.
                    type: integer
                  TotalRows:
                    description: Total rows.
                    type: integer
                  TotalPage:
                    description: Total pages.
                    type: integer
                  Data:
                    description: Array of object with information about the products of the collection.
                    type: array
                    items:
                      description: Product information.
                      type: object
                      properties:
                        ProductId:
                          description: Product ID.
                          type: integer
                        SkuId:
                          description: SKU ID.
                          type: integer
                        SubCollectionId:
                          description: Subcollection ID.
                          type: integer
                        Position:
                          description: Position of the product in the collection.
                          type: integer
                        ProductName:
                          description: Product name.
                          type: string
                        SkuImageUrl:
                          description: SKU image URL.
                          type: string
              example:
                Page: 1
                Size: 2
                TotalRows: 2
                TotalPage: 1
                Data:
                - ProductId: 1
                  SkuId: 1
                  SubCollectionId: 24
                  Position: 1
                  ProductName: Ração Royal Canin Feline Urinary
                  SkuImageUrl: https://lojadobreno.vteximg.com.br/arquivos/ids/155450
                - ProductId: 2
                  SkuId: 3
                  SubCollectionId: 24
                  Position: 2
                  ProductName: Caixa de Areia Azul Petmate
                  SkuImageUrl: https://lojadobreno.vteximg.com.br/arquivos/ids/155451
components:
  parameters:
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
