openapi: 3.2.0
info:
  title: VTex Catalog Product Specification API
  description: '> Check the new Catalog onboarding guide.'
  version: '1.0'
servers:
- url: https://{accountName}.{environment}.com.br
  description: VTEX server URL.
  variables:
    accountName:
      description: Name of the VTEX account. Used as part of the URL.
      default: apiexamples
    environment:
      description: Environment to use. Used as part of the URL.
      enum:
      - vtexcommercestable
      default: vtexcommercestable
security:
- appKey: []
  appToken: []
- VtexIdclientAutCookie: []
tags:
- name: Product Specification
paths:
  /api/catalog_system/pvt/products/{productId}/specification:
    get:
      tags:
      - Product Specification
      summary: VTex Get product specifications by product ID
      description: 'Retrieves all specifications of a product by the product''s ID.

        > 📘 Onboarding guide

        >

        > Check the new Catalog onboarding guide. We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Catalog and is organized by focusing on the developer''s journey.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: GetProductSpecification
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        description: Product's unique numerical identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
              - Value:
                - Iron
                - Plastic
                Id: 30
                Name: Material
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetorUpdateProductSpecification'
      deprecated: false
    post:
      tags:
      - Product Specification
      summary: VTex Update product specification by product ID
      description: 'Updates the value of a product specification by the product''s ID. The specification''s ID or name can be used to identify what product specification will be updated. specification fields must be previously created in your Catalog.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: UpdateProductSpecification
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        description: Product's unique identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GetorUpdateProductSpecification'
        required: true
      responses:
        '200':
          description: OK
      deprecated: false
  /api/catalog/pvt/product/{productId}/specification:
    get:
      tags:
      - Product Specification
      summary: VTex Get product specifications and their information by product ID
      description: 'Retrieves information of all specifications of a product by the product''s ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product and SKU Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: GetProductSpecificationbyProductID
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        description: Product's unique numerical identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
              - Id: 227
                ProductId: 1
                FieldId: 33
                FieldValueId: 135
                Text: ValueA
              - Id: 228
                ProductId: 1
                FieldId: 34
                FieldValueId: 1
                Text: Giant
              schema:
                type: array
                items:
                  type: object
                  description: Object with the product specification information.
                  properties:
                    Id:
                      type: integer
                      description: ID of the association of the specification and the product. This ID is used to update or delete the specification.
                    ProductId:
                      type: integer
                      description: Product ID.
                    FieldId:
                      type: integer
                      description: Specification field ID.
                    FieldValueId:
                      type: integer
                      description: Current specification value ID.
                    Text:
                      type: string
                      description: Current specification value text.
      deprecated: false
    post:
      tags:
      - Product Specification
      summary: VTex Associate product specification
      description: 'Associates a previously defined specification to a product.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product and SKU Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        required: true
        description: Product's unique numerical identifier.
        schema:
          type: integer
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - FieldId
              properties:
                FieldId:
                  type: integer
                  description: Specification field ID.
                  example: 19
                FieldValueId:
                  type: integer
                  description: Specification value ID. Mandatory for `FieldTypeId` `5`, `6` and `7`. Must not be used for any other Field types.
                  example: 12
                Text:
                  type: string
                  description: Value of specification. Only for `FieldTypeId` different from `5`, `6` and `7`.
                  example: Metal
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                Id: 41
                FieldId: 19
                FieldValueId: 1
                Text: test
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    description: ID of the association of the specification and the product. This ID is used to update or delete the specification.
                  ProductId:
                    type: integer
                    description: Product ID.
                  FieldId:
                    type: integer
                    description: Specification field ID.
                  FieldValueId:
                    type: integer
                    description: Specification value ID. Mandatory for `FieldTypeId` `5`, `6` and `7`. Must not be used for any other field types.
                  Text:
                    type: string
                    description: Value of specification. Only for `FieldTypeId` different from `5`, `6` and `7`.
      operationId: postApiCatalogPvtProductByProductIdSpecification
      x-operation-id-source: derived
    delete:
      tags:
      - Product Specification
      summary: VTex Delete all product specifications by product ID
      description: 'Deletes all product specifications given a specific product ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product and SKU Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: DeleteAllProductSpecifications
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        description: Product's unique numerical identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
  /api/catalog/pvt/product/{productId}/specification/{specificationId}:
    delete:
      tags:
      - Product Specification
      summary: VTex Delete a product specification
      description: 'Deletes a product specification given a product ID and a specification ID.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product and SKU Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      operationId: DeleteaProductSpecification
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        description: Product's unique numerical identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 1
      - name: specificationId
        in: path
        description: Product specification's unique numerical identifier.
        required: true
        style: simple
        schema:
          type: integer
          example: 7
      responses:
        '200':
          description: OK
  /api/catalog/pvt/product/{productId}/specificationvalue:
    put:
      tags:
      - Product Specification
      summary: VTex Associate product specification using specification name and group name
      description: 'Associates a specification to a product using specification name and group name. Automatically creates the informed group, specification and values if they had not been created before.


        ## Permissions


        Any user or application key must have at least one of the appropriate License Manager resources to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:


        | **Product** | **Category** | **Resource** |

        | --------------- | ----------------- | ----------------- |

        | Catalog | Content | **Product and SKU Management** |


        There are no applicable predefined roles for this resource list. You must create a custom role and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see Authentication overview.


        >❗ To prevent integrations from having excessive permissions, consider the best practices for managing app keys when assigning License Manager roles to integrations.'
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/Accept'
      - name: productId
        in: path
        required: true
        description: Product's unique numerical identifier.
        schema:
          type: integer
          example: 1
      requestBody:
        content:
          application/json:
            example:
              FieldName: Material
              GroupName: Composition
              RootLevelSpecification: true
              FieldValues:
              - Cotton
              - Polyester
            schema:
              type: object
              description: Object with product specification information.
              required:
              - FieldName
              - GroupName
              - RootLevelSpecification
              - FieldValues
              properties:
                FieldName:
                  type: string
                  description: Specification name. Limited to 100 characters.
                  example: Material
                GroupName:
                  type: string
                  description: Group name.
                  example: Composition
                RootLevelSpecification:
                  type: boolean
                  description: Root level specification.
                  example: true
                FieldValues:
                  type: array
                  description: Array of specification values.
                  example:
                  - Cotton
                  - Polyester
                  items:
                    type: string
                    description: Specification value.
                    example: Cotton
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
              - Id: 239
                ProductId: 1
                FieldId: 85
                FieldValueId: 193
                Text: Value123
              schema:
                type: array
                description: Array with information of all product specifications.
                items:
                  type: object
                  description: Object with information of the specification.
                  properties:
                    Id:
                      type: integer
                      description: ID of the association of the product and the specification.
                    ProductId:
                      type: integer
                      description: Product ID.
                    FieldId:
                      type: integer
                      description: Specification field ID.
                    FieldValueId:
                      type: integer
                      description: Current specification value ID.
                    Text:
                      type: string
                      description: Current specification value text.
      operationId: putApiCatalogPvtProductByProductIdSpecificationvalue
      x-operation-id-source: derived
components:
  parameters:
    Accept:
      name: Accept
      in: header
      description: HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
    Content-Type:
      name: Content-Type
      in: header
      description: Type of the content being sent.
      required: true
      style: simple
      schema:
        type: string
        default: application/json
  schemas:
    GetorUpdateProductSpecification:
      required:
      - Value
      type: object
      properties:
        Value:
          type: array
          description: Array with specification values.
          items:
            type: string
            description: Specification value.
            example: Cotton
        Id:
          type: integer
          format: int32
          description: Specification field ID, which is the same as `FieldId` in other specification endpoints.
          example: 7
        Name:
          type: string
          description: Name of the specification.
          example: Fabric
      example:
        Value:
        - Iron
        - Plastic
        Id: 30
        Name: Material
  securitySchemes:
    appKey:
      type: apiKey
      in: header
      name: X-VTEX-API-AppKey
      description: Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    appToken:
      type: apiKey
      in: header
      name: X-VTEX-API-AppToken
      description: Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys).
    VtexIdclientAutCookie:
      type: apiKey
      in: header
      name: VtexIdclientAutCookie
      description: '[User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours.'
